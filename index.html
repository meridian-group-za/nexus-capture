// --- Store-level question answers (loaded on demand) -----------------------
// All forms' answers together are ~870k rows / 274MB, so they are never part of
// the main payload. Each form has its own file under questions/, fetched only
// when a question on that form is opened, and cached for the session.
const QUESTION_FILE_CACHE = {};
let QDRILL = null;          // { form, question, file, loading, error, rows }

function questionFileFor(formName) {
  const c = DATA.campaigns.find(x => x.name === formName);
  return c && c.questionFile ? c.questionFile : null;
}

// questionText null means "every question on this form": the table is a
// store x question grid by default, and clicking a question narrows it.
async function openQuestionDrill(formName, questionText) {
  const file = questionFileFor(formName);
  if (!file) {
    QDRILL = { form: formName, question: questionText, error: 'No store-level answers were exported for this form.' };
    render();
    return;
  }
  state.answerFilter = 'ALL';
  QDRILL = { form: formName, question: questionText, file: file, loading: true };
  render();
  try {
    if (!QUESTION_FILE_CACHE[file]) {
      const payload = await loadDataFile('questions/' + file, false);
      QUESTION_FILE_CACHE[file] = (payload && payload.rows) || [];
    }
    const all = QUESTION_FILE_CACHE[file];
    // Reason questions are context for the answers, not rows in their own
    // right -- they stay out of the grid and feed the Issue column instead.
    const reasons = buildReasonIndex(all, questionText);
    const rows = questionText
      ? all.filter(r => r.question === questionText)
      : all.filter(r => r.question && !REASON_RE.test(r.question));
    QDRILL = {
      form: formName, question: questionText, file: file,
      rows: rows,
      allRows: all,
      reasons: reasons,
      stores: buildStoreIndex(formName),
    };
  } catch (e) {
    QDRILL = { form: formName, question: questionText, file: file, error: e.message };
  }
  render();
}

function closeQuestionDrill() { QDRILL = null; state.answerFilter = 'ALL'; render(); }
function setShowContextQs(v) { state.showContextQs = v; render(); }
function setFocusExpanded(v) { state.focusExpanded = v; render(); }
function setAnswerFilter(v) { state.answerFilter = (state.answerFilter === v) ? 'ALL' : v; render(); }

// Reason questions ("If no, provide a reason", "Why did Manager Refuse?") are
// themselves questions on the same form, so a store's reason for answering No
// is its answer to the neighbouring reason question. Built once per drill.
const REASON_RE = /reason|why|refus|no stock|order placed|issue/i;

function buildReasonIndex(allRows, forQuestion) {
  const idx = new Map();
  for (const r of allRows) {
    if (!r.question || r.question === forQuestion) continue;
    if (!REASON_RE.test(r.question)) continue;
    const a = r.answer;
    if (a === null || a === undefined || String(a).trim() === '') continue;
    const txt = String(a).trim();
    // Skip the placeholder answers reps type when a reason does not apply.
    if (/^(n\/?a|na|none|no|0|-)$/i.test(txt)) continue;
    if (!idx.has(r.store)) idx.set(r.store, txt);
  }
  return idx;
}

// Per-store compliance and image come from the main payload's storeRows, keyed
// by store code, so the drill can show them without another fetch.
function buildStoreIndex(formName) {
  const c = DATA.campaigns.find(x => x.name === formName);
  const idx = new Map();
  for (const r of (c && c.storeRows) || []) idx.set(r.store, r);
  return idx;
}

function answerTone(r) {
  if (r.isYes === true || r.isYes === 'True' || r.isYes === 'Yes' || r.isYes === 1) return 'good';
  if (r.isNo === true || r.isNo === 'True' || r.isNo === 'Yes' || r.isNo === 1) return 'crit';
  if (r.targetMet === 'Yes' || r.targetMet === true) return 'good';
  if (r.targetMet === 'No' || r.targetMet === false) return 'crit';
  return 'na';
}

function exportQuestionDrill() {
  if (!QDRILL || !QDRILL.rows) return;
  const labels = ['Form', 'Question', 'Store Code', 'Store Name', 'Region', 'Supervisor', 'Rep Name',
                  'Store Visited', 'Answer', 'Compliance', 'Issue Tracker', 'Image'];
  const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
  const lines = [labels.map(q).join(',')];
  const exportRows = state.answerFilter === 'yes' ? QDRILL.rows.filter(r => answerTone(r) === 'good')
                   : state.answerFilter === 'no'  ? QDRILL.rows.filter(r => answerTone(r) === 'crit')
                   : QDRILL.rows;
  exportRows.forEach(r => {
    const sr = QDRILL.stores ? QDRILL.stores.get(r.store) : null;
    const comp = sr && sr.compliance !== null && sr.compliance !== undefined ? sr.compliance : null;
    const isNo = answerTone(r) === 'crit';
    const reason = isNo && QDRILL.reasons ? QDRILL.reasons.get(r.store) : null;
    lines.push([QDRILL.form, r.question || QDRILL.question,
                r.store, r.storeName, r.region, r.manager, r.rep, r.captured, r.answer,
                comp === null ? '' : (comp * 100).toFixed(1) + '%',
                reason || '', r.image || (sr && sr.imageUrl) || ''].map(q).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'question-answers-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

// --- Price survey store detail --------------------------------------------
// Price surveys have no compliance metric, so the useful store-level view is
// the answers themselves: one row per store, one column per question. Loaded
// from the form's own question file on demand, same as the audit drill.
let PRICE_DRILL = null;   // { form, loading, error, questions, stores }

async function openPriceDetail(formName) {
  const c = DATA.campaigns.find(x => x.name === formName);
  if (!c || !c.questionFile) {
    PRICE_DRILL = { form: formName, error: 'No store-level answers were exported for this form.' };
    render();
    return;
  }
  PRICE_DRILL = { form: formName, loading: true };
  render();
  try {
    if (!QUESTION_FILE_CACHE[c.questionFile]) {
      const payload = await loadDataFile('questions/' + c.questionFile, false);
      QUESTION_FILE_CACHE[c.questionFile] = (payload && payload.rows) || [];
    }
    const rows = QUESTION_FILE_CACHE[c.questionFile];

    // Column order follows the form's own question order, not the order rows
    // happen to appear in.
    const declared = (c.questionRows || []).map(q => q.question);
    const seen = [...new Set(rows.map(r => r.question).filter(Boolean))];
    const questions = declared.filter(q => seen.includes(q))
      .concat(seen.filter(q => !declared.includes(q)));

    // Pivot to one record per store.
    const byStore = new Map();
    for (const r of rows) {
      let rec = byStore.get(r.store);
      if (!rec) {
        rec = { store: r.store, storeName: r.storeName, region: r.region,
                manager: r.manager, rep: r.rep, captured: r.captured,
                image: r.image || null, answers: {} };
        byStore.set(r.store, rec);
      }
      if (r.question) rec.answers[r.question] = r.answer;
      if (!rec.image && r.image) rec.image = r.image;
    }

    // Stores that were targeted but never captured have no answer rows at all,
    // so fold them in from the payload -- otherwise the table silently omits
    // exactly the stores that failed to report.
    for (const sr of c.storeRows || []) {
      if (byStore.has(sr.store)) continue;
      byStore.set(sr.store, {
        store: sr.store, storeName: sr.storeName, region: sr.region,
        manager: sr.manager, rep: sr.rep, captured: sr.captured,
        image: sr.imageUrl || null, answers: {},
      });
    }

    PRICE_DRILL = { form: formName, questions: questions, stores: [...byStore.values()] };
  } catch (e) {
    PRICE_DRILL = { form: formName, error: e.message };
  }
  render();
}

function closePriceDetail() { PRICE_DRILL = null; state.priceAnswered = 'ALL'; render(); }
function setPriceAnswered(v) { state.priceAnswered = (state.priceAnswered === v) ? 'ALL' : v; render(); }

function priceDetailRows() {
  if (!PRICE_DRILL || !PRICE_DRILL.stores) return [];
  const qs = PRICE_DRILL.questions;
  const hasAny = s => qs.some(q => {
    const a = s.answers[q];
    return a !== null && a !== undefined && String(a).trim() !== '';
  });
  let rows = PRICE_DRILL.stores;
  if (state.priceAnswered === 'answered') rows = rows.filter(hasAny);
  if (state.priceAnswered === 'missing') rows = rows.filter(s => !hasAny(s));
  return rows.filter(s => matchesFilters(s, null));
}

function exportPriceDetail() {
  if (!PRICE_DRILL || !PRICE_DRILL.stores) return;
  const qs = PRICE_DRILL.questions;
  const labels = ['Store Code', 'Store Name', 'Region', 'Supervisor', 'Rep Name', 'Store Visited']
    .concat(qs).concat(['Image']);
  const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
  const lines = [labels.map(q).join(',')];
  priceDetailRows().forEach(s => {
    lines.push([s.store, s.storeName, s.region, s.manager, s.rep, s.captured]
      .concat(qs.map(x => s.answers[x])).concat([s.image || '']).map(q).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'price-survey-detail-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function renderPriceDetail(priceForms) {
  const head = (title, sub, controls) => `
      <div class="panel-head">
        <div><div class="panel-title">${title}</div><div class="panel-sub">${sub}</div></div>
        ${controls || ''}
      </div>`;

  if (!PRICE_DRILL) {
    return `<div class="panel">${head('Store Level Detail',
      'Click a form above to load every store result for that survey')}
      <div class="panel-body"><div class="empty-state">Select a price survey form to see its store-by-store results.</div></div></div>`;
  }
  if (PRICE_DRILL.loading) {
    return `<div class="panel drill">${head('Store Level Detail', esc(PRICE_DRILL.form))}
      <div class="panel-body"><div class="empty-state">Loading store results&hellip;</div></div></div>`;
  }
  if (PRICE_DRILL.error) {
    return `<div class="panel drill">${head('Store Level Detail', esc(PRICE_DRILL.form),
      `<button class="reset-btn" onclick="closePriceDetail()">&times; Close</button>`)}
      <div class="panel-body"><div class="empty-state" style="color:var(--nx-crit);">${esc(PRICE_DRILL.error)}</div></div></div>`;
  }

  const qs = PRICE_DRILL.questions;
  const rows = priceDetailRows();
  const LIMIT = 400;
  const all = PRICE_DRILL.stores.filter(s => matchesFilters(s, null));
  const answered = all.filter(s => qs.some(q => {
    const a = s.answers[q];
    return a !== null && a !== undefined && String(a).trim() !== '';
  })).length;

  const controls = `
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <button class="filter-pill ${state.priceAnswered === 'answered' ? 'active good' : 'good'}" onclick="setPriceAnswered('answered')">Answered <b>${answered.toLocaleString()}</b></button>
          <button class="filter-pill ${state.priceAnswered === 'missing' ? 'active crit' : 'crit'}" onclick="setPriceAnswered('missing')">No result <b>${(all.length - answered).toLocaleString()}</b></button>
          <button class="filter-pill ${state.priceAnswered === 'ALL' ? 'active neutral' : 'neutral'}" onclick="setPriceAnswered('ALL')">All <b>${all.length.toLocaleString()}</b></button>
          <button class="reset-btn" onclick="exportPriceDetail()">Export to Excel</button>
          <button class="reset-btn" onclick="closePriceDetail()">&times; Close</button>
        </div>`;

  return `
    <div class="panel drill">
      ${head('Store Level Detail', esc(PRICE_DRILL.form) + ' &middot; ' + qs.length + ' question(s)', controls)}
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Store</th><th>Region</th><th>Supervisor</th><th>Rep Name</th><th>Store Visited</th>
          ${qs.map(q => `<th title="${esc(q)}">${esc(q.length > 40 ? q.slice(0, 38) + '…' : q)}</th>`).join('')}
          <th>Image</th>
        </tr></thead>
        <tbody>${rows.length ? rows.slice(0, LIMIT).map(s => `
          <tr>
            <td class="name-cell">${esc(s.storeName)} <span style="color:#4a6b8a;">(${esc(s.store)})</span></td>
            <td>${esc(s.region) || '—'}</td>
            <td>${esc(s.manager) || '—'}</td>
            <td>${esc(s.rep) || '—'}</td>
            <td><span class="pill ${s.captured === 'Yes' ? 'good' : 'crit'}">${esc(s.captured) || '—'}</span></td>
            ${qs.map(q => {
              const a = s.answers[q];
              const blank = a === null || a === undefined || String(a).trim() === '';
              return `<td class="answer-cell"${blank ? '' : ` title="${esc(a)}"`}>${blank ? '—' : esc(a)}</td>`;
            }).join('')}
            <td>${s.image ? `<a href="${esc(s.image)}" target="_blank" rel="noopener" style="color:var(--color-accent-300);">View</a>` : '—'}</td>
          </tr>`).join('') : `<tr><td colspan="${qs.length + 6}" class="empty-state">No stores match.</td></tr>`}</tbody>
      </table></div>
      ${rows.length > LIMIT ? `<div class="table-note">Showing first ${LIMIT} of ${rows.length.toLocaleString()} &mdash; Export includes all ${rows.length.toLocaleString()}.</div>` : ''}
    </div>
  `;
}

function renderQuestionDrill() {
  if (!QDRILL) return '';
  const head = `
      <div class="panel-head">
        <div><div class="panel-title">Store Answers</div>
        <div class="panel-sub">${QDRILL.question
            ? esc(QDRILL.question) + ' &middot; <a href="#" onclick="openQuestionDrill(' + jsArg(QDRILL.form) + ', null); return false;" style="color:var(--color-accent-300);">show all questions</a>'
            : 'Every question &times; every store &middot; click a question above to filter'} &middot; ${esc(QDRILL.form)}</div></div>
        <div style="display:flex;gap:8px;align-items:center;">
          ${QDRILL.rows ? `<button class="reset-btn" onclick="exportQuestionDrill()">Export to Excel</button>` : ''}
          <button class="reset-btn" onclick="closeQuestionDrill()">&times; Close</button>
        </div>
      </div>`;

  if (QDRILL.loading) {
    return `<div class="panel drill">${head}<div class="panel-body"><div class="empty-state">Loading store answers&hellip;</div></div></div>`;
  }
  if (QDRILL.error) {
    return `<div class="panel drill">${head}<div class="panel-body"><div class="empty-state" style="color:var(--nx-crit);">${esc(QDRILL.error)}</div></div></div>`;
  }

  const allRows = QDRILL.rows || [];
  const LIMIT = 400;
  // Counts stay on the full set so each pill shows what it would select, not
  // the size of the current selection.
  const yes = allRows.filter(r => answerTone(r) === 'good').length;
  const no = allRows.filter(r => answerTone(r) === 'crit').length;
  let rows = state.answerFilter === 'yes' ? allRows.filter(r => answerTone(r) === 'good')
           : state.answerFilter === 'no'  ? allRows.filter(r => answerTone(r) === 'crit')
           : allRows;
  // Grouped by store so one store's questions read as a block.
  if (!QDRILL.question) {
    rows = rows.slice().sort((a, b) =>
      String(a.storeName || '').localeCompare(String(b.storeName || '')) ||
      String(a.question || '').localeCompare(String(b.question || '')));
  }
  const bd = answerBreakdown(rows);
  // A Yes/No question is fully described by the two pills above. Anything else
  // -- reason questions, unit counts -- is only readable as its answers, so
  // show the frequency table for those.
  const isYesNo = (yes + no) >= bd.answered && bd.distinct <= 3;

  return `
    <div class="panel drill">
      ${head}
      <div class="panel-body" style="padding-bottom:6px;">
        <button class="filter-pill ${state.answerFilter === 'yes' ? 'active good' : 'good'}" onclick="setAnswerFilter('yes')">Yes <b>${yes.toLocaleString()}</b></button>
        <button class="filter-pill ${state.answerFilter === 'no' ? 'active crit' : 'crit'}" style="margin-left:6px;" onclick="setAnswerFilter('no')">No <b>${no.toLocaleString()}</b></button>
        <button class="filter-pill ${state.answerFilter === 'ALL' ? 'active neutral' : 'neutral'}" style="margin-left:6px;" onclick="setAnswerFilter('ALL')">All <b>${allRows.length.toLocaleString()}</b></button>
        ${state.answerFilter !== 'ALL' ? `<span class="scope-note">showing ${rows.length.toLocaleString()} of ${allRows.length.toLocaleString()}</span>` : ''}
      </div>
      ${!isYesNo && bd.answered ? `
      <div class="panel-body" style="padding-top:4px;padding-bottom:10px;">
        <div class="panel-title" style="margin-bottom:8px;">Answer breakdown</div>
        ${bd.list.slice(0, 10).map((a, i) => `
          <div class="ranked-row">
            <span class="rank">${i + 1}</span>
            <span class="name" style="width:300px;" title="${esc(a.answer)}">${esc(a.answer)}</span>
            <div class="track"><div class="fill" style="width:${a.count / bd.answered * 100}%;background:var(--color-accent);"></div></div>
            <span class="value">${a.count.toLocaleString()}</span>
            <span class="value bar-meta" style="width:56px;color:var(--color-neutral-500);font-weight:400;">${(a.count / bd.answered * 100).toFixed(0)}%</span>
          </div>`).join('')}
        <div class="table-note" style="padding:8px 0 0;">${bd.distinct.toLocaleString()} distinct answer(s) across ${bd.answered.toLocaleString()} answered store(s)${bd.distinct > 10 ? ', top 10 shown' : ''}.${bd.distinct > bd.answered * 0.5 ? ' Mostly free text, so counts are indicative rather than a metric.' : ''}</div>
      </div>` : ''}
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Question</th><th>Store</th><th>Region</th><th>Supervisor</th><th>Rep</th>
          <th>Visited</th><th>Answer</th><th>Compl.</th><th>Issue</th><th>Img</th>
        </tr></thead>
        <tbody>${rows.length ? rows.slice(0, LIMIT).map(r => {
          const sr = QDRILL.stores ? QDRILL.stores.get(r.store) : null;
          const comp = sr && sr.compliance !== null && sr.compliance !== undefined ? sr.compliance : null;
          // Only surface a reason where the store actually answered No -- a
          // reason attached to a Yes would be misleading.
          const isNo = answerTone(r) === 'crit';
          const reason = isNo && QDRILL.reasons ? QDRILL.reasons.get(r.store) : null;
          const img = r.image || (sr && sr.imageUrl) || '';
          return `
          <tr>
            <td class="q-col" title="${esc(r.question || QDRILL.question)}">${esc(r.question || QDRILL.question)}</td>
            <td class="name-cell" title="${esc(r.storeName)} (${esc(r.store)})">${esc(r.storeName)}</td>
            <td>${esc(r.region) || '—'}</td>
            <td>${esc(r.manager) || '—'}</td>
            <td>${esc(r.rep) || '—'}</td>
            <td><span class="pill ${r.captured === 'Yes' ? 'good' : 'crit'}">${esc(r.captured) || '—'}</span></td>
            <td><span class="pill ${answerTone(r)}">${esc(r.answer) || '—'}</span></td>
            <td>${comp === null ? '—' : `<span class="pill ${tierClass(pct(comp))}">${fmtPct(pct(comp), comp === 0 || comp === 1 ? 0 : 1)}</span>`}</td>
            <td class="issue-cell" title="${esc(reason || '')}">${reason ? esc(reason) : '—'}</td>
            <td>${img ? `<a href="${esc(img)}" target="_blank" rel="noopener" style="color:var(--color-accent-300);">View</a>` : '—'}</td>
          </tr>`;
        }).join('') : `<tr><td colspan="10" class="empty-state">${state.answerFilter === 'ALL' ? 'No store answers recorded for this question.' : 'No ' + state.answerFilter.toUpperCase() + ' answers for this question.'}</td></tr>`}</tbody>
      </table></div>
      ${rows.length > LIMIT ? `<div class="table-note">Showing first ${LIMIT} of ${rows.length.toLocaleString()} &mdash; Export includes all ${rows.length.toLocaleString()}.</div>` : ''}
    </div>
  `;
}

// --- Form Analysis --------------------------------------------------------
// One form at a time, top to bottom: compliance by question, compliance by
// region, then the store-level answers for whichever question is selected.
// Question-level aggregates come from the main payload; the store rows come
// from that form's own file, fetched on demand.

// Takes the already-filtered campaign list so the client / form / banner /
// region filters narrow the picker too. Falls back to everything only when
// called without a list.
function formsWithQuestions(list) {
  return (list || DATA.campaigns)
    .filter(c => c.status === 'complete' && (c.questionRows || []).length)
    .sort((a, b) => a.name.localeCompare(b.name));
}

// Land on the form that most needs looking at: lowest display compliance among
// forms still open, falling back to lowest overall.
function defaultForm(list) {
  const all = formsWithQuestions(list);
  if (!all.length) return null;
  const scored = all.filter(c => formCompliance(c) !== null);
  const open = scored.filter(isOpen);
  const pool = open.length ? open : (scored.length ? scored : all);
  return pool.slice().sort((a, b) => (formCompliance(a) ?? 1) - (formCompliance(b) ?? 1))[0].name;
}

function currentForm(list) {
  const all = formsWithQuestions(list);
  if (!all.length) return null;
  // A form pinned before the filters changed may no longer be in scope --
  // fall back rather than showing a form the filters exclude.
  if (state.qForm && all.some(c => c.name === state.qForm)) return state.qForm;
  return defaultForm(list);
}

// Per-question Yes and slot counts for just the stores in scope. Only possible
// once the form's answer file is loaded (it is, on Form Analysis -- the grid
// below loads it), so this returns null when it cannot be done honestly.
function filteredQuestionTotals(campaign) {
  if (!storeFilterActive()) return null;
  if (!QDRILL || QDRILL.form !== campaign.name || !QDRILL.allRows) return null;
  const inScope = new Set((campaign.storeRows || []).map(r => r.store));
  if (!inScope.size) return new Map();
  const totals = new Map();
  for (const r of QDRILL.allRows) {
    if (!r.question || !inScope.has(r.store)) continue;
    let t = totals.get(r.question);
    if (!t) { t = { yes: 0, answered: 0, sum: 0, numeric: 0, mean: null }; totals.set(r.question, t); }
    t.answered++;
    const v = Number(r.answer);
    if (r.answer !== null && r.answer !== '' && isFinite(v)) { t.sum += v; t.numeric++; t.mean = t.sum / t.numeric; }
    // answerTone already handles every shape Is Yes / Target Met arrives in
    // (numeric 1/0, TRUE/True, "Yes"), which a bespoke test here got wrong.
    if (answerTone(r) === 'good') t.yes++;
  }
  totals.storeCount = inScope.size;
  return totals;
}

// Rewrites a form's question rows against the filtered store set, so the bars
// and the form KPI move with the filters.
function questionRowsInScope(campaign) {
  const f = filteredQuestionTotals(campaign);
  if (!f) return campaign.questionRows || [];
  const n = f.storeCount || 0;
  const num = v => (v === null || v === undefined || v === '') ? null : Number(v);
  return (campaign.questionRows || []).map(q => {
    const t = f.get(q.question);
    const wasYesNo = num(q.yes) !== null && num(q.no) !== null && (num(q.yes) + num(q.no)) > 0;
    const hasTarget = num(q.targetCompliance) !== null || num(q.numericTarget) !== null;
    if (!t) {
      return Object.assign({}, q, wasYesNo ? { yes: 0, no: 0, target: n, answered: 0 }
        : hasTarget ? { metTarget: 0, targetCompliance: 0, target: n, answered: 0, average: null }
        : { answered: 0, average: null });
    }
    if (wasYesNo) {
      return Object.assign({}, q, { yes: t.yes, no: Math.max(0, t.answered - t.yes), target: n, answered: t.answered });
    }
    if (hasTarget) {
      // A KPI question with a target is scored on target-met, not Yes/No.
      return Object.assign({}, q, { metTarget: t.yes, targetCompliance: n ? t.yes / n : null,
                                    target: n, answered: t.answered, average: t.mean });
    }
    // No target: there is nothing to pass or fail, so only the mean changes.
    return Object.assign({}, q, { answered: t.answered, average: t.mean, target: n });
  });
}

function scoredQuestions(campaign) {
  // Sorted on the figure actually displayed, which is not always
  // Yes/No compliance: a facings question is scored on its target-met rate, and
  // a question with no target has only a mean answer. Sorting on the Yes/No
  // field alone left target questions in arbitrary order.
  const rank = { rate: 0, target: 0, avg: 1, none: 2 };
  return questionRowsInScope(campaign)
    .map(q => Object.assign({}, q, {
      compliance: (q.compliance === null || q.compliance === undefined || q.compliance === '')
        ? null : Number(q.compliance),
    }))
    .sort((a, b) => {
      const ma = questionMetric(a), mb = questionMetric(b);
      const ra = rank[ma.kind], rb = rank[mb.kind];
      if (ra !== rb) return ra - rb;                    // scored, then averages, then unscored
      if (ma.bar !== null && mb.bar !== null) return ma.bar - mb.bar;   // worst first
      return 0;
    });
}

// Numeric KPI answers are counts (shelves, facings) or rates of sale, so the
// sensible resolution differs by magnitude.
function fmtNum(v) {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (!isFinite(n)) return '—';
  // Targets are whole facings; showing "10.0" reads like a measurement.
  if (Number.isInteger(n)) return n.toLocaleString();
  if (Math.abs(n) >= 100) return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (Math.abs(n) >= 10) return n.toFixed(1);
  return n.toFixed(2);
}

// What a question's headline number should be. Yes/No questions have a
// compliance rate; Numeric KPI questions have a mean answer and sometimes a
// target-met rate; supporting/other questions have neither, only answers.
function questionMetric(q) {
  const num = v => (v === null || v === undefined || v === '') ? null : Number(v);
  const yes = num(q.yes), no = num(q.no), target = num(q.target), answered = num(q.answered);
  const reported = num(q.compliance);   // the report's own rate, over answered stores only

  // A store that was never visited has not complied, so it counts against the
  // question. Scoring over answered stores only lets one store answering yes
  // read as 100% on a 3,039-store form -- true of the sample, useless as a
  // measure. "reported" is kept for reconciliation with the Excel reports.
  if (yes !== null && no !== null && (yes + no) > 0) {
    const denom = target || (yes + no);
    const rate = yes / denom;
    return { kind: 'rate', bar: rate * 100, label: fmtPct(rate * 100, 1),
             yes: yes, no: no, answered: answered, target: target, reported: reported };
  }
  if (reported !== null) return { kind: 'rate', bar: reported * 100, label: fmtPct(reported * 100, 1), reported: reported };
  const tc = (q.targetCompliance === null || q.targetCompliance === undefined || q.targetCompliance === '')
    ? null : Number(q.targetCompliance);
  const avg = (q.average === null || q.average === undefined || q.average === '')
    ? null : Number(q.average);
  if (tc !== null) {
    return { kind: 'target', bar: tc * 100, label: fmtPct(tc * 100, 1),
             target: num(q.numericTarget), met: num(q.metTarget), avg: avg,
             note: 'avg ' + fmtNum(avg) };
  }
  if (avg !== null) return { kind: 'avg', bar: null, label: fmtNum(avg), note: 'average' };
  return { kind: 'none', bar: null, label: '—', note: q.type || '' };
}

// Frequency of answers for a question, most common first. Reason/supporting
// questions are free text, so this is a reading aid rather than a metric --
// hence the distinct-answer count alongside it.
function answerBreakdown(rows) {
  const freq = new Map();
  let answered = 0;
  for (const r of rows) {
    const a = r.answer;
    if (a === null || a === undefined || String(a).trim() === '') continue;
    answered++;
    const key = String(a).trim();
    freq.set(key, (freq.get(key) || 0) + 1);
  }
  const list = [...freq.entries()].map(([answer, count]) => ({ answer, count }))
    .sort((a, b) => b.count - a.count);
  return { list: list, answered: answered, distinct: list.length };
}

function setQForm(name) {
  state.qForm = name;
  QDRILL = null;
  AUTO_DRILL_FOR = null;
  render();
}

// The weakest scored question on a form -- what the drill opens by default.
function defaultDrillQuestion(c) {
  if (!c) return null;
  const qs = scoredQuestions(c).filter(q => {
    const k = questionMetric(q).kind;
    return k === 'rate' || k === 'target';
  });
  return qs.length ? qs[0].question : null;
}

// Guards the auto-open so it fires once per form, not on every re-render (a
// filter change would otherwise reload the file and fight the user's click).
let AUTO_DRILL_FOR = null;

function maybeAutoOpenDrill(formName) {
  if (!formName || AUTO_DRILL_FOR === formName) return;
  if (QDRILL && QDRILL.form === formName) { AUTO_DRILL_FOR = formName; return; }
  const c = DATA.campaigns.find(x => x.name === formName);
  const q = c && c.questionFile ? true : null;
  if (!q) { AUTO_DRILL_FOR = formName; return; }
  AUTO_DRILL_FOR = formName;
  // Deferred: render() is mid-flight, and openQuestionDrill calls render again.
  // Opens with no question, i.e. the full store x question grid.
  setTimeout(() => openQuestionDrill(formName, null), 0);
}

function renderFormAnalysis(campaigns) {
  const forms = formsWithQuestions(campaigns);
  if (!forms.length) {
    return '<div class="panel"><div class="panel-body"><div class="empty-state">No form with question results matches the current filters.</div></div></div>';
  }

  const formName = currentForm(campaigns);
  // Use the filtered instance, so region/banner filters narrow this form's
  // store rows too rather than silently showing the unfiltered set.
  const c = campaigns.find(x => x.name === formName) || DATA.campaigns.find(x => x.name === formName);
  const qs = scoredQuestions(c);
  const scored = qs.filter(q => q.compliance !== null);
  const t = timing(c);

  // Region breakdown for this form only, from its own store rows.
  const byRegion = rollupGroups([c], 'region').sort((a, b) => (b.compliance ?? -1) - (a.compliance ?? -1));

  const selected = QDRILL && QDRILL.form === formName ? QDRILL.question : null;
  maybeAutoOpenDrill(formName);

  const worstQ = scored.length ? scored[0] : null;

  const kpi = (label, value, sub, color) => `
      <div class="kpi-card"><div class="kpi-accent" style="background:${color};"></div><div class="kpi-body">
        <span class="kpi-label">${label}</span><span class="kpi-value" style="color:${color};">${value}</span>
        <span class="kpi-sub">${sub}</span>
      </div></div>`;

  // Question bars. Clicking a label loads that question's store answers.
  const measured = qs.filter(q => questionMetric(q).kind !== 'none');
  const contextQs = qs.filter(q => questionMetric(q).kind === 'none');

  const questionBars = measured.map((q, i) => {
    const m = questionMetric(q);
    const active = selected === q.question;
    // Only a percentage can share one 0-100 scale. A mean answer (5.8 shelves,
    // 673 units) has no such scale, so those rows show the number without a
    // bar rather than a bar that means nothing.
    const bar = m.bar === null
      ? '<div class="track no-scale" title="No percentage scale for this question type"></div>'
      : `<div class="track"><div class="fill" style="width:${m.bar}%;background:${tierColor(m.bar)};"></div></div>`;
    const meta = m.kind === 'rate'
      ? `${Number(q.yes || 0).toLocaleString()} yes of ${Number(q.target || 0).toLocaleString()}`
      : m.kind === 'target'
        ? `target ${fmtNum(m.target)} &middot; avg ${fmtNum(m.avg)}` +
          (m.met !== null && m.met !== undefined && m.target !== null
            ? ` &middot; ${Number(m.met).toLocaleString()} of ${Number(q.target || 0).toLocaleString()} met`
            : '')
        : esc(m.note || '');
    return `
      <div class="ranked-row ${active ? 'row-active' : ''}">
        <span class="rank">${i + 1}</span>
        <button class="name name-btn q-name ${active ? 'active' : ''}" title="${active ? 'Show all questions again' : esc(q.question)}"
                onclick="openQuestionDrill(${jsArg(formName)}, ${active ? 'null' : jsArg(q.question)})">${esc(q.question)}</button>
        ${bar}
        <span class="value" style="color:${m.bar === null ? 'var(--color-neutral-300)' : tierColor(m.bar)};">${m.label}</span>
        <span class="value bar-meta" style="width:210px;text-align:right;color:var(--color-neutral-500);font-weight:400;">${meta}</span>
      </div>`;
  }).join('');

  const regionBars = byRegion.map((a, i) => {
    const v = a.compliance === null ? null : a.compliance * 100;
    return `
      <div class="ranked-row">
        <span class="rank">${i + 1}</span>
        <span class="name">${esc(a.key)}</span>
        <div class="track"><div class="fill" style="width:${v === null ? 0 : v}%;background:${tierColor(v)};"></div></div>
        <span class="value" style="color:${tierColor(v)};">${v === null ? '—' : fmtPct(v, 1)}</span>
        <span class="value bar-meta" style="width:104px;color:var(--color-neutral-500);font-weight:400;">${a.captured.toLocaleString()}/${a.target.toLocaleString()} captured</span>
      </div>`;
  }).join('');

  return `
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">Form</div>
        <div class="panel-sub">${formName ? esc(formName) : ''}</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <select class="form-picker" onchange="setQForm(this.value)">
            ${forms.map(f => `<option value="${esc(f.name)}" ${f.name === formName ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}
          </select>
          <button class="reset-btn" onclick="exportQuestions()">Export questions</button>
        </div>
      </div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(5,minmax(0,1fr));">
      ${kpi('Capturing Compliance', fmtPct(pct(c.coverage)), `${(c.captured || 0).toLocaleString()} of ${(c.target || 0).toLocaleString()} visited`, tierColor(pct(c.coverage)))}
      ${(() => {
        // Same rule as the question bars: every targeted store is in the
        // denominator. The report's own figure (answered stores only) is kept
        // in the sub-line so the two can be reconciled.
        const rows = c.storeRows || [];
        const answered = answeredCount(rows);
        const overTargeted = complianceSlots(rows, slotsFor(c));
        return kpi('Display Compliance', fmtPct(pct(overTargeted)),
          `${answered.toLocaleString()} of ${rows.length.toLocaleString()} stores answered &middot; ${fmtPct(pct(c.compliance))} of those`,
          tierColor(pct(overTargeted)));
      })()}
      ${kpi('Time Gone', t.known ? fmtPct(t.timeGone * 100) : '—', t.known ? (t.open ? fmtDaysLeft(t.daysLeft) : 'closed') : '', 'var(--color-neutral-400)')}
      ${kpi('Questions', measured.length, `${contextQs.length} issue-tracking question(s) excluded`, 'var(--color-accent)')}
      ${kpi('Weakest Question', worstQ ? fmtPct(worstQ.compliance * 100) : '—', worstQ ? esc(worstQ.question.slice(0, 46)) : '', 'var(--nx-crit)')}
    </div>

    <div class="panel">
      <div class="panel-head"><div>
        <div class="panel-title">Compliance by Question</div>
        <div class="panel-sub">${storeFilterActive() ? '<span style="color:var(--color-accent-300);">Filtered to the stores in scope.</span> ' : ''}Worst first &middot; a % is the share of targeted stores that complied &mdash; answered Yes, or met the facings target &mdash; with unanswered counting against. A plain number is the mean answer where the question sets no target. Click a question for store answers.</div>
      </div></div>
      <div class="panel-body">${questionBars || '<div class="empty-state">This form has no scored questions.</div>'}</div>
      ${contextQs.length ? `<div class="table-note">${contextQs.length} issue-tracking question(s) are not scored and are excluded here &mdash; their answers appear in the Issue Tracker column below. <button class="reset-btn" style="padding:2px 8px;font-size:10px;" onclick="setShowContextQs(${state.showContextQs ? 'false' : 'true'})">${state.showContextQs ? 'Hide' : 'Show'} them</button></div>
      ${state.showContextQs ? `<div class="panel-body" style="padding-top:0;">${contextQs.map((q, i) => `
        <div class="ranked-row">
          <span class="rank">${i + 1}</span>
          <button class="name name-btn q-name" title="${esc(q.question)}" onclick="openQuestionDrill(${jsArg(formName)}, ${jsArg(q.question)})">${esc(q.question)}</button>
          <span class="value bar-meta" style="width:110px;color:var(--color-neutral-500);font-weight:400;">${esc(q.type || '')}</span>
        </div>`).join('')}</div>` : ''}` : ''}
    </div>

    <div class="panel">
      <div class="panel-head"><div>
        <div class="panel-title">Compliance by Region</div>
        <div class="panel-sub">This form only &middot; scored over all targeted stores</div>
      </div></div>
      <div class="panel-body">${regionBars || '<div class="empty-state">No store rows for this form.</div>'}</div>
    </div>

    ${QDRILL && QDRILL.form === formName
      ? renderQuestionDrill()
      : `<div class="panel"><div class="panel-head"><div>
           <div class="panel-title">Store Level Detail by Question</div>
           <div class="panel-sub">${defaultDrillQuestion(c) ? 'Loading&hellip;' : 'No scored question on this form'}</div>
         </div></div><div class="panel-body"><div class="empty-state">${defaultDrillQuestion(c) ? 'Loading store answers&hellip;' : 'This form has no scored question to break down by store.'}</div></div></div>`}
  `;
}

const QUESTION_COLUMNS = [
  { key: 'form',       label: 'Form' },
  { key: 'group',      label: 'Group' },
  { key: 'type',       label: 'Type' },
  { key: 'question',   label: 'Question' },
  { key: 'target',     label: 'Target' },
  { key: 'answered',   label: 'Answered' },
  { key: 'yes',        label: 'Yes' },
  { key: 'no',         label: 'No' },
  { key: 'compliance', label: 'Compliance' },
];

// One row per question per form. Region/banner/manager filters do not apply --
// Question Summary is aggregated per form, with no store dimension to filter on.
function questionRows(campaigns) {
  const out = [];
  campaigns.forEach(c => {
    (c.questionRows || []).forEach(q => {
      if (state.qType !== 'ALL' && q.type !== state.qType) return;
      out.push({
        form: c.name,
        group: q.group === 'Ungrouped' ? '' : (q.group || ''),
        type: q.type || '',
        question: q.question || '',
        target: q.target,
        answered: q.answered,
        yes: q.yes,
        no: q.no,
        compliance: (q.compliance === null || q.compliance === undefined || q.compliance === '') ? null : Number(q.compliance),
        numericTarget: q.numericTarget,
      });
    });
  });
  const rows = state.qSearch
    ? out.filter(r => (r.question + ' ' + r.form).toLowerCase().includes(state.qSearch.toLowerCase()))
    : out;
  // Worst first; unscored question types (Numeric KPI, Supporting, Other) sort
  // to the bottom rather than being treated as 0%.
  return rows.sort((a, b) => {
    if (a.compliance === null && b.compliance === null) return 0;
    if (a.compliance === null) return 1;
    if (b.compliance === null) return -1;
    return a.compliance - b.compliance;
  });
}

function setQType(v) { state.qType = (state.qType === v) ? 'ALL' : v; render(); }
function setQSearch(v) { state.qSearch = v; render(); }

function exportQuestions() {
  const rows = questionRows(getFilteredCampaigns());
  const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
  const lines = [QUESTION_COLUMNS.map(c => q(c.label)).join(',')];
  for (const r of rows) {
    lines.push(QUESTION_COLUMNS.map(c => c.key === 'compliance'
      ? q(r.compliance === null ? '' : (r.compliance * 100).toFixed(1) + '%')
      : q(r[c.key])).join(','));
  }
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'form-questions-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function renderQuestions(campaigns) {
  const rows = questionRows(campaigns);
  const LIMIT = 600;

  // Type counts ignore the type pill so each pill shows what it would select.
  const savedType = state.qType;
  state.qType = 'ALL';
  const all = questionRows(campaigns);
  state.qType = savedType;
  const counts = {};
  all.forEach(r => { counts[r.type] = (counts[r.type] || 0) + 1; });

  const scored = rows.filter(r => r.compliance !== null);
  const avg = scored.length ? scored.reduce((a, r) => a + r.compliance, 0) / scored.length : null;
  const failing = scored.filter(r => r.compliance < 0.50).length;

  const pill = (type, tone) => `
    <button class="filter-pill ${state.qType === type ? 'active ' + tone : tone}"
            onclick="setQType('${type}')">${type} <b>${(counts[type] || 0).toLocaleString()}</b></button>`;

  return `
    ${renderQuestionDrill()}
    <div class="kpi-grid" style="grid-template-columns:repeat(4,minmax(0,1fr));">
      <div class="kpi-card"><div class="kpi-accent" style="background:var(--color-accent);"></div><div class="kpi-body">
        <span class="kpi-label">Questions</span><span class="kpi-value">${rows.length.toLocaleString()}</span>
        <span class="kpi-sub">across ${new Set(rows.map(r => r.form)).size} form(s)</span>
      </div></div>
      <div class="kpi-card"><div class="kpi-accent" style="background:${tierColor(pct(avg))};"></div><div class="kpi-body">
        <span class="kpi-label">Avg Compliance</span><span class="kpi-value" style="color:${tierColor(pct(avg))};">${fmtPct(pct(avg))}</span>
        <span class="kpi-sub">${scored.length.toLocaleString()} scored question(s)</span>
      </div></div>
      <div class="kpi-card"><div class="kpi-accent" style="background:var(--nx-crit);"></div><div class="kpi-body">
        <span class="kpi-label">Below 50%</span><span class="kpi-value" style="color:var(--nx-crit);">${failing.toLocaleString()}</span>
        <span class="kpi-sub">scored questions under half</span>
      </div></div>
      <div class="kpi-card"><div class="kpi-accent" style="background:var(--color-neutral-400);"></div><div class="kpi-body">
        <span class="kpi-label">Unscored</span><span class="kpi-value">${(rows.length - scored.length).toLocaleString()}</span>
        <span class="kpi-sub">KPI / supporting &mdash; no Yes/No rate</span>
      </div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">Form Questions</div>
        <div class="panel-sub">Worst compliance first &middot; ${rows.length.toLocaleString()} question(s)</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${pill('Yes/No', 'good')}
          ${pill('Numeric KPI', 'crit')}
          <input class="search-input" placeholder="Search question or form…" value="${esc(state.qSearch)}" oninput="setQSearch(this.value)">
          <button class="reset-btn" onclick="exportQuestions()">Export to Excel</button>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Form</th><th>Group</th><th>Type</th><th>Question</th>
          <th class="num">Target</th><th class="num">Answered</th><th class="num">Yes</th><th class="num">No</th><th>Compliance</th>
        </tr></thead>
        <tbody>${rows.length ? rows.slice(0, LIMIT).map(r => `
          <tr>
            <td class="name-cell" title="${esc(r.form)}">${esc(r.form)}</td>
            <td>${esc(r.group) || '—'}</td>
            <td><span class="type-tag ${r.type === 'Yes/No' ? 'audit' : 'sos'}">${esc(r.type) || '—'}</span></td>
            <td class="q-cell"><button class="name-btn" style="width:100%;" title="Show store answers for this question"
                onclick="openQuestionDrill(${jsArg(r.form)}, ${jsArg(r.question)})">${esc(r.question)}</button></td>
            <td class="num">${r.target === null || r.target === undefined ? '—' : Number(r.target).toLocaleString()}</td>
            <td class="num">${r.answered === null || r.answered === undefined ? '—' : Number(r.answered).toLocaleString()}</td>
            <td class="num">${r.yes === null || r.yes === undefined ? '—' : Number(r.yes).toLocaleString()}</td>
            <td class="num">${r.no === null || r.no === undefined ? '—' : Number(r.no).toLocaleString()}</td>
            <td>${r.compliance === null
                  ? `<span class="pill na">${r.numericTarget ? 'target ' + esc(r.numericTarget) : 'n/a'}</span>`
                  : `<span class="mini-track"><span class="mini-fill" style="width:${pct(r.compliance)}%;background:${tierColor(pct(r.compliance))};"></span></span><span class="pill ${tierClass(pct(r.compliance))}">${fmtPct(pct(r.compliance))}</span>`}</td>
          </tr>
        `).join('') : `<tr><td colspan="9" class="empty-state">No questions match the current filters.</td></tr>`}</tbody>
      </table></div>
      <div class="table-note">
        ${rows.length > LIMIT ? `Showing first ${LIMIT} of ${rows.length.toLocaleString()} on screen &mdash; Export includes all ${rows.length.toLocaleString()}. ` : ''}Click a question to load its store-by-store answers. Region, banner and store filters do not apply to this table: Question Summary is aggregated per form and has no store dimension. Only Yes/No questions carry a compliance rate.
      </div>
    </div>
  `;
}

function setFormStatus(v) { state.formStatus = (state.formStatus === v) ? 'ALL' : v; render(); }

// Excel opens CSV directly. A BOM keeps store names with accents intact, and
// every field is quoted so commas in form names cannot shift columns.
function renderPage(campaigns) {
  switch (state.page) {
    case 'overview': return renderOverview(campaigns);
    case 'campaigns': return renderCampaignsTable(campaigns);
    case 'pricing': return renderPricing(campaigns);
    case 'questions': return renderFormAnalysis(campaigns);
    default: return '';
  }
}

// render() replaces the whole tree, which would drop focus on every keystroke.
// Capture the caret before, restore after.
function withFocusPreserved(fn) {
  const active = document.activeElement;
  const id = active && active.id;
  const pos = active && active.selectionStart;
  fn();
  if (!id) return;
  const next = document.getElementById(id);
  if (!next) return;
  next.focus();
  if (pos !== null && pos !== undefined && next.setSelectionRange) {
    try { next.setSelectionRange(pos, pos); } catch (e) { /* not a text input */ }
  }
}

function render() { withFocusPreserved(renderTree); }

function renderTree() {
  if (!DATA) return;
  const opts = buildFilterOptions();
  const campaigns = getFilteredCampaigns();
  const genDate = new Date(DATA.generatedAt);
  const storesInView = campaigns.reduce((a,c) => a + (c.captured||0), 0);

  document.getElementById('app').innerHTML = `
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><img src="assets/meridian-mark.png" alt="Meridian"></div>
          <div class="brand-name">Meridian <span>Nexus</span></div>
        </div>
        <div class="brand-sub">Capture</div>
        <nav>
          ${NAV_ITEMS.map(n => `<button class="nav-item ${n.id===state.page?'active':''}" onclick="setPage('${n.id}')">${navIcon(n.icon)}<span>${n.label}</span></button>`).join('')}
        </nav>
        <div class="sidebar-foot">
          ${ACCOUNT && !(typeof AUTH_DISABLED !== 'undefined' && AUTH_DISABLED)
            ? `<div class="who" title="${esc(ACCOUNT.username || '')}">${esc(ACCOUNT.name || ACCOUNT.username || '')}</div>` : ''}
          <button class="signout" onclick="signOut()">Sign out</button>
          <div>Last updated<br><b>${genDate.toLocaleString('en-ZA', {dateStyle:'medium', timeStyle:'short'})}</b></div>
        </div>
      </aside>
      <main class="main">
        <div class="main-inner">
          <div class="page-head">
            <div><h1>${pageTitle()}</h1></div>
            <div class="head-stat"><div class="head-stat-label">Stores captured</div><div class="head-stat-value">${storesInView.toLocaleString()}</div></div>
          </div>
          <div class="divider"></div>
          <div class="filters">${renderFilters(opts)}</div>
          <div class="content">${renderPage(campaigns)}</div>
        </div>
      </main>
    </div>
  `;
}

// Nothing loads until there is a signed-in account. On a deployed origin
// requireAuth() redirects to login.html and never resolves; on localhost it
// resolves immediately, matching the Call Cycle portal's local-dev bypass.
requireAuth()
  .then(account => {
    ACCOUNT = account;
    return loadDataFile('compliance_data.json', false);
  })
  .then(d => { DATA = d; render(); })
  .catch(e => { document.getElementById('app').innerHTML = `<div id="page-loading">Could not load compliance_data.json &mdash; ${esc(e.message)}</div>`; });
</script>

<script>
// "Back to Nexus", shown only when the portal sent you here and said where to
// return to. The destination is checked against the portal's own URL: taking
// an arbitrary ?from= on trust is an open redirect waiting to happen.
//
// Placed inside the sidebar, above the footer, rather than floated in a
// corner - these dashboards have a full-height sticky sidebar, so every corner
// already belongs to something (logo, Log out, sticky header).
(function () {
  var NEXUS = "https://meridian-group-za.github.io/Meridian-Nexus/portal.html";
  // Always offer the way back. ?from= says which module view to return to;
  // without it we still go to the portal, just to its overview. Anything that
  // is not the portal itself is ignored rather than followed - an unchecked
  // ?from= is an open redirect.
  var from = NEXUS;
  try {
    var asked = new URLSearchParams(window.location.search).get("from");
    if (asked && asked.indexOf(NEXUS) === 0) from = asked;
  } catch (e) { /* keep the default */ }

  function footerAnchor() {
    // The footer block: "Last updated" if the dashboard has one, otherwise the
    // Log out control. Either way we insert immediately above it.
    var all = document.querySelectorAll("div,a,button,span,p");
    var logout = null;
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.children.length > 2) continue;
      var txt = (el.textContent || "").trim();
      if (/^last updated/i.test(txt) && txt.length < 60) return el;
      if (!logout && /^log ?out$/i.test(txt)) logout = el;
    }
    return logout;
  }

  function add() {
    if (document.getElementById("nx-back")) return;
    var anchor = footerAnchor();
    if (!anchor || !anchor.parentNode) return;

    var a = document.createElement("a");
    a.id = "nx-back";
    a.href = from;
    a.textContent = "\u2190 Back to Nexus";
    a.title = "Back to the Meridian Nexus portal";
    a.style.cssText = [
      "display:block", "margin:14px 14px 4px", "padding:10px 14px",
      "border-radius:10px", "text-align:center",
      "background:rgba(236,109,37,0.12)", "border:1px solid rgba(236,109,37,0.38)",
      "color:#f2955c", "font:600 13px/1.2 Poppins,Segoe UI,system-ui,sans-serif",
      "text-decoration:none", "cursor:pointer"
    ].join(";");
    a.addEventListener("mouseenter", function () {
      a.style.background = "rgba(236,109,37,0.2)";
    });
    a.addEventListener("mouseleave", function () {
      a.style.background = "rgba(236,109,37,0.12)";
    });

    // Above the footer block, which is where the gap under the nav sits.
    var target = anchor;
    while (target.parentNode && target.parentNode.children.length === 1) {
      target = target.parentNode;
    }
    target.parentNode.insertBefore(a, target);
  }

  // These dashboards render their sidebar from JS, so the footer may not exist
  // yet on DOMContentLoaded. Watch briefly, then stop - no permanent observer.
  function watch() {
    add();
    if (document.getElementById("nx-back")) return;
    var tries = 0;
    var timer = setInterval(function () {
      add();
      if (document.getElementById("nx-back") || ++tries > 40) clearInterval(timer);
    }, 250);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", watch);
  } else {
    watch();
  }
})();
</script>
