<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Capture Compliance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="./auth.js?v=3"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --color-bg:#000C21; --color-surface:#061530; --color-text:#f3f7fc;
    --color-accent:#ec6d25; --color-accent-2:#f2955c;
    --color-accent-100:#fde7d8; --color-accent-200:#f8c3a1; --color-accent-300:#f2955c;
    --color-accent-400:#ee7f3c; --color-accent-500:#ec6d25; --color-accent-600:#cf5a18;
    --color-accent-700:#a94711; --color-accent-800:#2a4568; --color-accent-900:#132b47;
    --color-neutral-100:#f3f7fc; --color-neutral-200:#e2ebf5; --color-neutral-300:#c9d7e6;
    --color-neutral-400:#9dc4ec; --color-neutral-500:#5f80a6; --color-neutral-600:#4f6c8e;
    --color-neutral-700:#3d5f85; --color-neutral-800:#1c3f6b; --color-neutral-900:#122d4f;
    --font-heading:'Poppins', system-ui, sans-serif; --font-body:'Poppins', system-ui, sans-serif;
    --radius-md:10px; --radius-lg:16px;
    --nx-good:#22c55e; --nx-warn:#e8a838; --nx-crit:#e4574c;
  }
  html { color-scheme: dark; }
  body { font-family:var(--font-body); font-size:13px; background:var(--color-bg); color:var(--color-text); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:rgba(157,196,236,.25); border-radius:6px; }
  ::-webkit-scrollbar-track { background:transparent; }

  .shell { display:flex; min-height:100vh; background:var(--color-bg); }

  .sidebar { width:208px; flex:none; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
    display:flex; flex-direction:column; border-right:1px solid var(--color-neutral-800); background:#0a1c3a; }
  .brand { display:flex; align-items:center; gap:9px; padding:18px 16px 12px; }
  .brand-mark { width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center; }
  .brand-mark img { width:100%; height:100%; object-fit:contain; display:block; }
  .brand-name { font-family:var(--font-heading); font-size:16px; font-weight:700; letter-spacing:-.015em; line-height:1.2; }
  .brand-name span { color:var(--color-accent); }
  .brand-sub { padding:0 16px 10px; font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:#fff; text-align:center; }
  nav { display:flex; flex-direction:column; gap:1px; padding:6px 10px; flex:1; }
  .nav-item { display:flex; align-items:center; gap:12px; padding:7px 11px; border-radius:var(--radius-md); cursor:pointer;
    font-size:12.5px; font-weight:500; border-left:2px solid transparent; background:transparent; color:var(--color-neutral-300);
    border:none; border-left:2px solid transparent; width:100%; text-align:left; font-family:inherit; }
  .nav-item { gap:10px; }
  .nav-ico { width:16px; height:16px; flex:0 0 16px; opacity:.62; }
  .nav-item:hover { background:color-mix(in srgb, var(--color-accent) 9%, transparent); }
  .nav-item:hover .nav-ico { opacity:.9; }
  .nav-item.active .nav-ico { opacity:1; color:var(--color-accent); }
  .nav-item.active { border-left:2px solid var(--color-accent); background:color-mix(in srgb, var(--color-accent) 12%, transparent); color:var(--color-neutral-100); }
  .sidebar-foot { padding:10px 16px 14px; border-top:1px solid var(--color-neutral-800); font-size:10.5px; color:var(--color-neutral-500); line-height:1.5; text-align:center; }
  .sidebar-foot b { color:var(--color-neutral-300); font-weight:500; }
  .sidebar-foot .who { color:var(--color-neutral-200); font-size:11px; font-weight:600; margin-bottom:5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .signout { background:transparent; border:1px solid var(--color-neutral-800); color:var(--color-neutral-400);
    border-radius:999px; padding:3px 11px; font-size:10px; font-family:inherit; cursor:pointer; margin-bottom:10px; }
  .signout:hover { border-color:var(--color-accent-700); color:var(--color-accent-300); }

  .main { flex:1; min-width:0; padding:18px clamp(16px,2vw,26px) 32px; overflow:visible; }
  .main-inner { max-width:1700px; }
  .page-head { display:flex; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-bottom:10px; }
  .page-head h1 { margin:0 0 2px; font-size:21px; font-family:var(--font-heading); font-weight:700; color:var(--color-neutral-100); }
  .eyebrow { color:var(--color-accent); font-size:9.5px; font-weight:700; letter-spacing:.18em; margin-bottom:4px; text-transform:uppercase; }
  .head-stat { margin-left:auto; text-align:right; }
  .head-stat-label { font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-neutral-500); }
  .head-stat-value { font-family:var(--font-heading); font-size:22px; line-height:1.1; color:var(--color-neutral-100); }
  .divider { height:1px; background:linear-gradient(90deg,transparent,var(--color-neutral-800) 48px,var(--color-neutral-800) calc(100% - 48px),transparent); margin-bottom:14px; }

  .filters { display:flex; gap:6px; flex-wrap:wrap; align-items:center;
    position:sticky; top:0; z-index:30; background:var(--color-bg);
    margin-inline:calc(-1 * clamp(16px,2vw,26px)); padding:10px clamp(16px,2vw,26px);
    margin-bottom:14px; border-bottom:1px solid var(--color-neutral-800);
    box-shadow:0 6px 16px -8px rgba(0,0,0,.75); }
  .filters select { background:#0a1c3a; border:1px solid var(--color-neutral-800); color:var(--color-text); border-radius:var(--radius-md);
    padding:6px 8px; font-size:11.5px; font-family:inherit; flex:none; }
  .filters select option { background:#0f2c4f; color:#e9e9ed; }
  .reset-btn { background:transparent; border:1px solid var(--color-neutral-800); color:var(--color-neutral-400); border-radius:var(--radius-md);
    padding:6px 12px; font-size:11px; font-family:inherit; cursor:pointer; flex:none; white-space:nowrap; }
  .reset-btn:hover { border-color:var(--color-accent-700); color:var(--color-accent-300); }

  .content { display:flex; flex-direction:column; gap:12px; min-width:0; }
  /* Two panels sharing a row. auto-fit rather than a fixed breakpoint: it goes
     two-up whenever ~320px per column is available, so display scaling and
     window size sort themselves out without a magic media-query number. */
  .panel-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; align-items:start; }
  /* Bar rows inside a half-width panel need a narrower label gutter. */
  .panel-row .ranked-row { gap:8px; }
  .panel-row .ranked-row .name { width:132px; }
  .panel-row .ranked-row .value { width:46px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; }
  .kpi-card { border-radius:var(--radius-md); background:var(--color-surface); border:1px solid var(--color-neutral-800);
    display:flex; flex-direction:column; overflow:hidden; }
  .kpi-accent { height:3px; }
  .kpi-body { padding:9px 12px 11px; display:flex; flex-direction:column; gap:3px; }
  .kpi-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--color-neutral-400); }
  .kpi-value { font-size:21px; font-weight:700; line-height:1; color:var(--color-neutral-100); }
  .kpi-sub { font-size:10px; line-height:1.35; color:var(--color-neutral-500); }

  .panel { border-radius:var(--radius-lg); background:var(--color-surface); border:1px solid var(--color-neutral-800); min-width:0; }
  .panel-head { padding:11px 15px 2px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .panel-title { font-size:12px; font-weight:600; color:var(--color-neutral-100); text-transform:uppercase; letter-spacing:.07em; }
  .panel-sub { font-size:11px; margin-top:3px; color:var(--color-neutral-500); }
  .panel-body { padding:8px 15px 13px; }
  .search-input { height:32px; padding:0 12px; font-size:12px; border-radius:var(--radius-md); background:#0a1c3a; border:1px solid var(--color-neutral-800); color:var(--color-text); font-family:inherit; outline:none; width:220px; }
  .search-input:focus { border-color:var(--color-accent-700); }
  .form-picker { background:#0a1c3a; border:1px solid var(--color-neutral-800); color:var(--color-text);
    border-radius:var(--radius-md); padding:7px 10px; font-size:12px; font-family:inherit; max-width:460px; }
  .form-picker option { background:#0f2c4f; }
  .q-name { width:auto !important; flex:1 1 340px; min-width:180px; }
  .form-filter { display:flex; align-items:center; gap:6px; }
  .form-filter .search-input { width:300px; height:28px; font-size:11.5px; }
  .scope-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .scope-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--color-neutral-400); }
  .scope-note { font-size:11px; color:var(--color-neutral-500); margin-left:2px; }
  .filter-pill { border-radius:999px; padding:4px 11px; font-size:11px; font-family:inherit; cursor:pointer;
    background:transparent; border:1px solid var(--color-neutral-800); color:var(--color-neutral-400); white-space:nowrap; }
  .filter-pill b { font-weight:700; }
  .filter-pill.good:hover { border-color:var(--nx-good); color:var(--nx-good); }
  .filter-pill.crit:hover { border-color:var(--nx-crit); color:var(--nx-crit); }
  .filter-pill.neutral:hover { border-color:var(--color-neutral-400); color:var(--color-neutral-200); }
  .filter-pill.active.neutral { background:rgba(157,196,236,.14); border-color:var(--color-neutral-400); color:var(--color-neutral-200); }
  .filter-pill.active.good { background:rgba(34,197,94,.16); border-color:var(--nx-good); color:var(--nx-good); }
  .filter-pill.active.crit { background:rgba(228,87,76,.16); border-color:var(--nx-crit); color:var(--nx-crit); }
  .chip-clear { background:color-mix(in srgb, var(--color-accent) 14%, transparent); border:1px solid var(--color-accent-700);
    color:var(--color-accent-300); border-radius:999px; padding:3px 9px; font-size:10px; font-family:inherit; cursor:pointer; white-space:nowrap; }

  .focus-list { display:flex; flex-wrap:wrap; gap:10px; }
  .focus-item { display:flex; align-items:center; gap:9px; border-radius:var(--radius-md); padding:7px 11px; font-size:11.5px; flex:1; min-width:240px; background:color-mix(in srgb, var(--nx-crit) 10%, transparent); border:1px solid color-mix(in srgb, var(--nx-crit) 32%, transparent); }
  .focus-item .dot { width:8px; height:8px; border-radius:50%; background:var(--nx-crit); flex-shrink:0; }
  .focus-item b { color:var(--color-neutral-100); font-weight:700; }
  .focus-item .pct { margin-left:auto; font-weight:700; color:var(--nx-crit); flex-shrink:0; }
  .focus-item.warn { background:color-mix(in srgb, var(--nx-warn) 9%, transparent); border-color:color-mix(in srgb, var(--nx-warn) 30%, transparent); }
  .focus-item.warn .dot { background:var(--nx-warn); }
  .focus-item.warn .pct { color:var(--nx-warn); }
  .empty-state { padding:14px; text-align:center; font-size:12px; color:var(--color-neutral-500); }

  .ranked-row { display:flex; align-items:center; gap:10px; padding:3px 0; min-height:22px; }
  .ranked-row .rank { width:18px; font-size:10px; font-weight:700; text-align:center; color:var(--color-neutral-500); flex-shrink:0; }
  .ranked-row .name { width:210px; flex-shrink:0; font-size:12px; color:var(--color-neutral-100); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ranked-row .track { flex:1; min-width:120px; background:var(--color-accent-900); border-radius:4px; height:10px; overflow:hidden; }
  .ranked-row .fill { height:100%; border-radius:4px; }
  .ranked-row .value { width:52px; text-align:right; font-size:12px; font-weight:700; flex-shrink:0; }
  .bar-meta { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Half-width panels: the meta column has to be narrower or it wraps. */
  .panel-row .bar-meta { width:78px !important; font-size:10px; }
  /* Clickable bar labels. Underline on hover so it reads as a control without
     adding chrome to every row. */
  .name-btn { background:none; border:none; padding:0; margin:0; font:inherit; font-size:12px; text-align:left;
    color:var(--color-neutral-100); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .name-btn:hover { color:var(--color-accent-300); text-decoration:underline; }
  .name-btn.active { color:var(--color-accent); font-weight:700; }
  .name-btn.active::after { content:' \00d7'; font-weight:700; }
  /* Store Answers has 9 columns; at the default sizing the Image column fell
     off the right edge. Tightened here only. */
  /* All Forms has to fit without horizontal scroll. */
  #forms-table table { font-size:10px; }
  #forms-table th { padding:5px 6px; font-size:8.5px; }
  #forms-table td { padding:2px 6px; }
  #forms-table .pill { padding:0 5px; font-size:9px; }
  #forms-table .name-cell { max-width:290px; }
  #forms-table .mini-track { width:36px; }
  .drill table { font-size:10px; }
  .drill th { padding:5px 6px; font-size:8.5px; }
  .drill td { padding:2px 6px; }
  .drill .pill { padding:0 5px; font-size:9px; }
  .drill .q-col { max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--color-neutral-300); }
  .drill .name-cell { max-width:190px; }
  .drill .issue-cell { max-width:170px; }
  .drill { border-color:var(--color-accent-700); box-shadow:0 0 0 1px color-mix(in srgb, var(--color-accent) 22%, transparent); }
  /* A question with no percentage scale gets an inert track, so rows still
     line up without implying a value of zero. */
  .track.no-scale { background:repeating-linear-gradient(90deg, var(--color-accent-900) 0 6px, transparent 6px 12px); opacity:.5; }
  .row-active { background:color-mix(in srgb, var(--color-accent) 8%, transparent); border-radius:6px; }
  @media (max-width:820px) { .bar-meta { display:none; } }

  table { width:100%; border-collapse:collapse; font-size:11px; }
  thead tr { background:var(--color-accent-900); }
  .table-wrap { position:relative; z-index:1; }
  th { text-align:left; padding:6px 8px; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--color-neutral-400); white-space:nowrap; }
  th.num, td.num { text-align:right; }
  td { padding:4px 8px; border-top:1px solid var(--color-neutral-800); color:var(--color-text); white-space:nowrap; }
  tbody tr:hover { background:color-mix(in srgb, var(--color-accent) 7%, transparent); }
  .answer-cell { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .issue-cell { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--nx-warn); }
  .q-cell { max-width:520px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--color-neutral-100); }
  .name-cell { color:var(--color-neutral-100); font-weight:500; max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill { display:inline-flex; align-items:center; gap:4px; padding:1px 7px; border-radius:999px; font-size:10px; font-weight:700; white-space:nowrap; }
  .pill.good { background:rgba(34,197,94,.14); color:var(--nx-good); border:1px solid rgba(34,197,94,.35); }
  .pill.warn { background:rgba(232,168,56,.14); color:var(--nx-warn); border:1px solid rgba(232,168,56,.35); }
  .pill.crit { background:rgba(228,87,76,.14); color:var(--nx-crit); border:1px solid rgba(228,87,76,.35); }
  .pill.na { background:color-mix(in srgb, var(--color-neutral-400) 10%, transparent); color:var(--color-neutral-500); border:1px solid var(--color-neutral-800); }
  .mini-track { display:inline-flex; width:48px; height:6px; border-radius:3px; background:var(--color-accent-900); overflow:hidden; vertical-align:middle; margin-right:8px; }
  .mini-fill { height:100%; border-radius:3px; display:block; }
  .table-wrap { overflow-x:auto; }
  .table-note { font-size:10.5px; color:var(--color-neutral-500); padding:6px 15px 11px; }
  .type-tag { display:inline-flex; align-items:center; padding:1px 6px; border-radius:5px; font-size:9px; font-weight:600; white-space:nowrap; }
  .type-tag.audit { background:color-mix(in srgb, var(--color-neutral-400) 10%, transparent); color:var(--color-neutral-400); }
  .type-tag.sos { background:color-mix(in srgb, var(--color-accent) 12%, transparent); color:var(--color-accent-300); }
  .type-tag.price { background:color-mix(in srgb, var(--color-neutral-400) 6%, transparent); color:var(--color-neutral-500); }

  #page-loading { padding:60px; text-align:center; color:var(--color-neutral-500); font-size:13px; }
</style>
</head>
<body>
<div id="app"><div id="page-loading">Loading compliance data&hellip;</div></div>

<script>
// Inline stroke icons for the sidebar. currentColor so they inherit the
// nav item's hover/active colour; 1.6 stroke reads cleanly at 16px.
const ICONS = {
  gauge:     '<path d="M3 13a9 9 0 1 1 18 0"/><path d="M12 13l4-3"/><circle cx="12" cy="13" r="1.4"/><path d="M3 13h2M19 13h2M12 4v2"/>',
  clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 10h7M8.5 14h7M8.5 18h4"/>',
  tag:       '<path d="M20.6 12.4 12.4 20.6a2 2 0 0 1-2.8 0l-6.2-6.2a2 2 0 0 1 0-2.8L11.6 3.4a2 2 0 0 1 1.4-.6h5.6a2 2 0 0 1 2 2V11a2 2 0 0 1-.6 1.4Z"/><circle cx="16.5" cy="7.5" r="1.4"/>',
  help:      '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/>',
};
function navIcon(name) {
  return '<svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" '
       + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}

const NAV_ITEMS = [
  { id: 'overview',    label: 'Overview',             icon: 'gauge' },
  { id: 'campaigns',   label: 'All Forms',            icon: 'clipboard' },
  { id: 'pricing',     label: 'Price Surveys',        icon: 'tag' },
  { id: 'questions',   label: 'Form Analysis',        icon: 'help' },
];

let DATA = null;
let ACCOUNT = null;
let state = { page: 'overview', client: 'ALL', region: 'ALL', manager: 'ALL', banner: 'ALL', captured: 'ALL', formStatus: 'ALL', answerFilter: 'ALL', priceAnswered: 'ALL', showContextQs: false, focusExpanded: false, qForm: null, qType: 'ALL', qSearch: '', search: '', formQ: '', scope: 'open' };

function pct(v) { return v === null || v === undefined ? null : v * 100; }
function fmtPct(v, digits) { return v === null || v === undefined ? '—' : v.toFixed(digits === undefined ? 1 : digits) + '%'; }
function tierColor(p) {
  if (p === null || p === undefined) return '#4a6b8a';
  if (p < 40) return 'var(--nx-crit)';
  if (p < 70) return 'var(--nx-warn)';
  return 'var(--nx-good)';
}
function tierClass(p) {
  if (p === null || p === undefined) return 'na';
  if (p < 40) return 'crit';
  if (p < 70) return 'warn';
  return 'good';
}
// --- Campaign timing -------------------------------------------------------
// Survey windows vary per campaign (26 distinct windows in the August set), so
// pacing is only meaningful per campaign, never as one global number.
function today() { return new Date(new Date().toISOString().slice(0,10)); }

function timing(c) {
  if (!c.periodStart || !c.periodEnd) return { known:false, open:false, timeGone:null, daysLeft:null };
  const start = new Date(c.periodStart), end = new Date(c.periodEnd), now = today();
  const span = Math.max(1, Math.round((end - start) / 86400000));
  const daysLeft = Math.round((end - now) / 86400000);
  return {
    known: true,
    open: now <= end,
    timeGone: Math.max(0, Math.min(1, Math.round((now - start) / 86400000) / span)),
    daysLeft: daysLeft,
  };
}

// How far coverage has fallen behind the clock. Positive = behind schedule.
// This is what makes "20% captured" readable: alarming at 90% of the window
// gone, entirely normal at 15%.
function pacingGap(c) {
  const t = timing(c);
  if (!t.known || !t.open || c.coverage === null || c.coverage === undefined) return null;
  return t.timeGone - c.coverage;
}

function isOpen(c) { return timing(c).open; }

// Region / manager / banner narrow the set of STORES, not the set of forms.
// The precomputed region and question totals are whole-form aggregates, so
// while one of these is active every compliance figure has to be recomputed
// from the filtered store rows instead -- otherwise the numbers ignore the
// filter entirely (store rows dropped 66,106 -> 7,904 for one manager while
// every percentage stayed identical).
function storeFilterActive() {
  return state.region !== 'ALL' || state.manager !== 'ALL' || state.banner !== 'ALL';
}

// --- Display compliance ----------------------------------------------------
// Scored over every targeted store: a store that was never visited has not
// complied, so it counts against the result. Averaging over answered stores
// only lets one store answering yes read as 100% on a 3,000-store form.
// The reports themselves use the answered-only basis, so where a comparison
// matters both are shown -- reportCompliance() is that figure.
// Every Yes/No check on every targeted store is a slot. A Yes fills it;
// anything else -- a No, a question the rep skipped, a store never visited --
// leaves it empty and counts against compliance.
//
// This is deliberately NOT the average of each store's own rate: that ignores
// checks a store left blank, so a store answering 2 of 8 checks with both Yes
// scored 100% instead of 25%. On a third of forms the two differ by 15-50
// points (Soill Checkers ROS read 75.9% that way, 25.3% this way).
function complianceSlots(rows, slotsPerStore) {
  const slots = (rows || []).length * (slotsPerStore || 0);
  if (!slots) return null;
  let yes = 0;
  for (const r of rows) {
    // rate x answered checks, not the "Yes Checks" column: that column covers a
    // narrower set of checks on ~11 forms (Highveld August sums to 600 against
    // 2,588 actual Yes answers), which understated everything badly.
    if (r.compliance === null || r.compliance === undefined) continue;
    const ac = Number(r.answeredChecks);
    yes += (isFinite(ac) && ac > 0) ? r.compliance * ac : (r.compliance === 1 ? 1 : 0);
  }
  return yes / slots;
}

function slotsFor(c) {
  return c && c.yesNoSlots ? Number(c.yesNoSlots) : 1;
}

// Kept for groupings that span forms: accumulates yes-checks and slots per
// form so each form contributes its own denominator.
function complianceOverTargeted(rows, slotsPerStore) {
  return complianceSlots(rows, slotsPerStore);
}

function answeredCount(rows) {
  return (rows || []).filter(r => r.compliance !== null && r.compliance !== undefined).length;
}

// Compliance of a form on the targeted basis, from its own store rows.
// Yes answers over every check slot: (targeted stores x Yes/No questions).
// Taken from Question Summary, which is the only place the per-question Yes
// totals are authoritative -- the Store Results per-store columns cover a
// narrower set of checks on ~11 forms (Highveld August: 600 vs 2,588 yes), so
// reconstructing from store rows understates those badly.
function questionSlotTotals(c) {
  let yes = 0, slots = 0;
  for (const q of c.questionRows || []) {
    const y = Number(q.yes), n = Number(q.no), t = Number(q.target);
    if (!isFinite(y) || !isFinite(n) || (y + n) <= 0) continue;   // not a scored Yes/No check
    yes += y;
    slots += isFinite(t) && t > 0 ? t : (y + n);
  }
  return { yes: yes, slots: slots };
}

function formCompliance(c) {
  if (c.kind === 'price') return null;
  if (storeFilterActive()) return complianceSlots(c.storeRows || [], slotsFor(c));
  const q = questionSlotTotals(c);
  if (q.slots) return q.yes / q.slots;
  // Single-question reports have no Question Summary sheet; their per-store
  // answer is the whole result, so the store rows are exact.
  return complianceSlots(c.storeRows || [], slotsFor(c));
}

// Across a set of forms, pooling every store row rather than averaging the
// per-form percentages -- a 23-store form should not weigh the same as a
// 5,000-store one.
function poolCompliance(list) {
  let yes = 0, slots = 0;
  for (const c of list || []) {
    if (c.kind === 'price') continue;
    const q = storeFilterActive() ? { slots: 0 } : questionSlotTotals(c);
    if (q.slots) { yes += q.yes; slots += q.slots; continue; }
    // Same estimator as complianceSlots -- counting only compliance === 1 threw
    // away every partially-compliant store and read ~1.6% instead of ~24%.
    const rows = c.storeRows || [], per = slotsFor(c);
    slots += rows.length * per;
    for (const r of rows) {
      if (r.compliance === null || r.compliance === undefined) continue;
      const ac = Number(r.answeredChecks);
      yes += (isFinite(ac) && ac > 0) ? r.compliance * ac : (r.compliance === 1 ? 1 : 0);
    }
  }
  return slots ? yes / slots : null;
}

// --- Banner ----------------------------------------------------------------
// Banner comes from the Call Cycle Master, joined in by
// extract_compliance_data.py on the GeoRep store code (MER####). ~99% of store
// rows match; the rest have no banner row in the master and group as "Unknown".
function bannerOf(row) { return row.banner || 'Unknown'; }

// Roll store rows up by an arbitrary key, returning coverage (capture rate) and
// average store compliance side by side -- the two are different questions and
// a group can be strong on one and weak on the other.
// Region and banner breakdowns use exact per-group Yes and check-slot totals
// that extract_compliance_data.py precomputes from the store-level answers.
// Deriving them in the browser would mean downloading all 117 per-form answer
// files (~870k rows); the precomputed totals are ~10 regions and ~60 banners
// per form. Falls back to store rows for any form without them.
function rollupGroups(campaignList, which) {
  const acc = new Map();
  let exact = 0, approx = 0;
  const bump = (key, t) => {
    let a = acc.get(key);
    if (!a) { a = { key: key, target: 0, captured: 0, yes: 0, slots: 0 }; acc.set(key, a); }
    a.target += t.target || 0; a.captured += t.captured || 0;
    a.yes += t.yes || 0; a.slots += t.slots || 0;
    return a;
  };
  for (const c of campaignList) {
    if (c.kind === 'price') continue;
    const totals = which === 'region' ? c.regionTotals : c.bannerTotals;
    if (!storeFilterActive() && totals && Object.keys(totals).length) {
      exact++;
      for (const [key, t] of Object.entries(totals)) bump(key, t);
      continue;
    }
    approx++;
    const per = slotsFor(c);
    for (const r of c.storeRows || []) {
      const key = (which === 'region' ? r.region : r.banner) || (which === 'region' ? 'Unassigned' : 'Unknown');
      const ac = Number(r.answeredChecks);
      const yes = (r.compliance === null || r.compliance === undefined) ? 0
        : ((isFinite(ac) && ac > 0) ? r.compliance * ac : (r.compliance === 1 ? 1 : 0));
      bump(key, { target: 1, captured: r.captured === 'Yes' ? 1 : 0, yes: yes, slots: per });
    }
  }
  const list = [...acc.values()].map(a => Object.assign(a, {
    coverage: a.target ? a.captured / a.target : null,
    compliance: a.slots ? a.yes / a.slots : null,
  }));
  list.exactForms = exact; list.approxForms = approx;
  return list;
}

function rollup(campaignList, keyFn) {
  const acc = new Map();
  for (const c of campaignList) {
    const per = slotsFor(c);
    for (const r of c.storeRows || []) {
      const k = keyFn(r);
      if (!k) continue;
      let a = acc.get(k);
      if (!a) { a = { key:k, target:0, captured:0, yesChecks:0, slots:0, compN:0 }; acc.set(k, a); }
      a.target++;
      if (r.captured === 'Yes') a.captured++;
      a.slots += per;
      if (r.compliance !== null && r.compliance !== undefined) {
        const ac = Number(r.answeredChecks);
        a.yesChecks += (isFinite(ac) && ac > 0) ? r.compliance * ac : (r.compliance === 1 ? 1 : 0);
        a.compN++;
      }
    }
  }
  return [...acc.values()].map(a => Object.assign(a, {
    coverage: a.target ? a.captured / a.target : null,
    // Yes-checks over every check slot in the group, matching formCompliance().
    compliance: a.slots ? a.yesChecks / a.slots : null,
  }));
}

// Compact form for table cells, where "29 days left" is most of the column.
function fmtDaysShort(n) {
  if (n === null || n === undefined) return '';
  if (n < 0) return 'closed';
  if (n === 0) return 'today';
  return n + 'd';
}

function fmtDaysLeft(n) {
  if (n === null) return '';
  if (n < 0) return 'closed';
  if (n === 0) return 'closes today';
  if (n === 1) return '1 day left';
  return n + ' days left';
}

// A JS string literal safe inside a double-quoted HTML attribute. JSON.stringify
// alone emits double quotes, which terminate the attribute and silently break
// the handler -- so the quotes are entity-encoded for the parser to decode.
function jsArg(v) {
  return JSON.stringify(String(v))
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function esc(s) { return (s === null || s === undefined) ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function matchesFilters(row, campaignClient) {
  if (state.client !== 'ALL' && campaignClient !== state.client) return false;
  if (state.region !== 'ALL' && row.region !== state.region) return false;
  if (state.manager !== 'ALL' && row.manager !== state.manager) return false;
  if (state.banner !== 'ALL' && bannerOf(row) !== state.banner) return false;
  return true;
}

// The form box is a substring match, so it works as both a picker (choose an
// exact name from the dropdown) and a search ("clicks" narrows to every Clicks
// form). Applied here so every page honours it, not just All Forms.
function matchesForm(c) {
  if (!state.formQ) return true;
  return c.name.toLowerCase().includes(state.formQ.toLowerCase());
}

function getFilteredCampaigns() {
  // Recompute each campaign's metrics from its storeRows under the current
  // region/manager filter (client filter drops whole campaigns).
  return DATA.campaigns
    .filter(matchesForm)
    .filter(c => state.client === 'ALL' || c.client === state.client)
    .map(c => {
      const rows = c.storeRows.filter(r => matchesFilters(r, c.client));
      if (state.region === 'ALL' && state.manager === 'ALL' && state.banner === 'ALL') {
        return c; // unfiltered at store level -- use the report's own authoritative numbers
      }
      const captured = rows.filter(r => r.captured === 'Yes').length;
      const compliance = complianceSlots(rows, slotsFor(c));
      return Object.assign({}, c, {
        target: rows.length,
        captured: captured,
        coverage: rows.length ? captured / rows.length : null,
        compliance: c.kind === 'price' ? null : compliance,
        notCaptured: rows.length - captured,
        storeRows: rows,
      });
    })
    .filter(c => c.storeRows === undefined || true); // keep all; empty-after-filter campaigns still show as 0s
}

function distinctSorted(arr) { return [...new Set(arr.filter(Boolean))].sort(); }

function buildFilterOptions() {
  const clients = distinctSorted(DATA.campaigns.map(c => c.client));
  const regions = distinctSorted(DATA.campaigns.flatMap(c => c.storeRows.map(r => r.region)));
  const managers = distinctSorted(DATA.campaigns.flatMap(c => c.storeRows.map(r => r.manager)));
  const banners = distinctSorted(DATA.campaigns.flatMap(c => c.storeRows.map(r => r.banner)));
  const forms = distinctSorted(DATA.campaigns.map(c => c.name));
  return { clients, regions, managers, banners, forms };
}

function renderFilters(opts) {
  const mkOptions = (list, sel, allLabel) => `<option value="ALL">${allLabel}</option>` + list.map(v => `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
  // <input list> gives a native type-to-search dropdown: the full form list is
  // browsable, and typing narrows it. id is used to restore focus after render.
  const matched = opts.forms.filter(f => !state.formQ || f.toLowerCase().includes(state.formQ.toLowerCase())).length;
  return `
    <div class="form-filter">
      <input id="form-filter-input" class="search-input" list="form-options" autocomplete="off"
             placeholder="All forms &mdash; type to search" value="${esc(state.formQ)}"
             oninput="setFormQ(this.value)">
      <datalist id="form-options">${opts.forms.map(f => `<option value="${esc(f)}"></option>`).join('')}</datalist>
      ${state.formQ ? `<button class="chip-clear" title="Clear form filter" onclick="setFormQ('')">&times; ${matched} match${matched===1?'':'es'}</button>` : ''}
    </div>
    <select onchange="setFilter('client',this.value)">${mkOptions(opts.clients, state.client, 'All clients')}</select>
    <select onchange="setFilter('banner',this.value)">${mkOptions(opts.banners, state.banner, 'All banners')}</select>
    <select onchange="setFilter('region',this.value)">${mkOptions(opts.regions, state.region, 'All regions')}</select>
    <select onchange="setFilter('manager',this.value)">${mkOptions(opts.managers, state.manager, 'All managers')}</select>
    <button class="reset-btn" onclick="resetFilters()">Reset</button>
  `;
}

function setFilter(key, value) { state[key] = value; render(); }
function resetFilters() { state.client='ALL'; state.region='ALL'; state.manager='ALL'; state.banner='ALL'; state.captured='ALL'; state.formStatus='ALL'; state.answerFilter='ALL'; state.priceAnswered='ALL'; state.qForm=null; state.qType='ALL'; state.qSearch=''; state.search=''; state.formQ=''; render(); }
function setFormQ(v) { state.formQ = v; render(); }

// Clicking a bar label filters by it; clicking the active one clears it, so the
// label doubles as its own "off" switch and you never get stuck in a filter.
function toggleFilter(key, value) {
  state[key] = (state[key] === value) ? 'ALL' : value;
  render();
}
function setPage(id) { state.page = id; render(); }
function setSearch(v) { state.search = v; render(); }
function setScope(v) { state.scope = v; render(); }

function pageTitle() { return NAV_ITEMS.find(n => n.id === state.page).label; }

function storeRowCount(list) {
  return list.reduce((a, c) => a + ((c.storeRows || []).length), 0);
}

function renderOverview(campaigns) {
  const completeForms = campaigns.filter(c => c.status === 'complete');
  const pendingForms  = campaigns.filter(c => c.status === 'pending' || c.status === 'locked');
  const openForms     = completeForms.filter(isOpen);
  const closedForms   = completeForms.filter(c => !isOpen(c));

  // KPI row describes work in progress -- the P&G Overview framing. Falls back
  // to all completed forms if nothing is open, so the page is never blank
  // between cycles.
  // The scope toggle governs everything on this page, KPI row included --
  // "Open" was previously applied only to the breakdowns, which made the cards
  // look unresponsive to a control sitting right next to them.
  const kpiForms = state.scope === 'all'
    ? completeForms
    : (openForms.length ? openForms : completeForms);
  const kpiIsOpen = state.scope !== 'all' && openForms.length > 0;

  const kTarget   = kpiForms.reduce((a,c) => a + (c.target||0), 0);
  const kCaptured = kpiForms.reduce((a,c) => a + (c.captured||0), 0);
  const kNotCap   = kpiForms.reduce((a,c) => a + (c.notCaptured||0), 0);
  const visited   = kTarget ? kCaptured / kTarget : null;

  const kAudits = kpiForms.filter(c => c.kind !== 'price' && c.compliance !== null && c.compliance !== undefined);
  const kCompliance = poolCompliance(kpiForms);
  const kAuditRows = kpiForms.filter(c => c.kind !== 'price').flatMap(c => c.storeRows || []);
  const kAnswered = answeredCount(kAuditRows);

  const timed = kpiForms.map(timing).filter(t => t.known);
  const avgTimeGone = timed.length ? timed.reduce((a,t) => a + t.timeGone, 0) / timed.length : null;

  const behind = openForms
    .map(c => ({ c: c, gap: pacingGap(c), t: timing(c) }))
    .filter(x => x.gap !== null)
    .sort((a,b) => b.gap - a.gap);
  // Same rule as the Behind Time Gone KPI, so the count matches this list.
  const focus = behind.filter(x => x.gap > 0);
  // Nothing behind schedule is good news, but an empty panel says nothing --
  // fall back to the weakest forms on display compliance so there is always a
  // next thing to look at. focusBasis tells the reader which rule produced it.
  let focusBasis = 'behind';
  let focusList = focus;
  if (!focusList.length) {
    const weakest = cs => cs
      .filter(c => formCompliance(c) !== null)
      .sort((a, b) => formCompliance(a) - formCompliance(b))
      .slice(0, 4)
      .map(c => ({ c: c, gap: pacingGap(c), t: timing(c) }));
    const openWeak = weakest(openForms);
    if (openWeak.length) { focusList = openWeak; focusBasis = 'openCompliance'; }
    else { focusList = weakest(closedForms); focusBasis = 'closedCompliance'; }
  }

  // Breakdowns follow the scope toggle; default matches the KPI row.
  const scopeForms = kpiForms;
  const cmp = k => (a,b) => (b[k] != null ? b[k] : -1) - (a[k] != null ? a[k] : -1);
  const byRegion     = rollupGroups(scopeForms, 'region').sort(cmp('coverage'));
  const byRegionComp = [...byRegion].sort(cmp('compliance'));
  const byBanner     = rollupGroups(scopeForms, 'banner')
    .filter(a => a.target >= 15).sort(cmp('compliance'));

  const kpi = (label, value, sub, color) => `
      <div class="kpi-card"><div class="kpi-accent" style="background:${color};"></div><div class="kpi-body">
        <span class="kpi-label">${label}</span><span class="kpi-value" style="color:${color};">${value}</span>
        <span class="kpi-sub">${sub}</span>
      </div></div>`;

  // Shared bar-list renderer for the three breakdown panels.
  // filterKey: which state filter the label drives ('region' / 'banner').
  const barList = (rows, valueFn, subFn, filterKey) => rows.map((a,i) => {
    const raw = valueFn(a);
    const v = (raw === null || raw === undefined) ? null : raw * 100;
    const active = filterKey && state[filterKey] === a.key;
    const label = filterKey
      ? `<button class="name name-btn ${active ? 'active' : ''}" title="${active ? 'Clear this filter' : 'Filter by ' + esc(a.key)}" onclick="toggleFilter('${filterKey}', ${jsArg(a.key)})">${esc(a.key)}</button>`
      : `<span class="name">${esc(a.key)}</span>`;
    return `
        <div class="ranked-row ${active ? 'row-active' : ''}"><span class="rank">${i+1}</span>
          ${label}
          <div class="track"><div class="fill" style="width:${v === null ? 0 : v}%;background:${tierColor(v)};"></div></div>
          <span class="value" style="color:${tierColor(v)};">${fmtPct(v,1)}</span>
          <span class="value bar-meta" style="width:92px;color:var(--color-neutral-500);font-weight:400;">${subFn(a)}</span>
        </div>`;
  }).join('');

  const scopeNote = state.scope === 'all'
    ? `all ${completeForms.length} completed forms`
    : (kpiIsOpen ? `${openForms.length} open form(s)` : `all ${completeForms.length} completed forms (nothing open)`);

  const scopeToggle = `
    <div class="scope-bar">
      <span class="scope-label">Showing</span>
      <button class="filter-pill ${state.scope === 'open' ? 'active good' : 'good'}" onclick="setScope('open')">In Progress <b>${openForms.length.toLocaleString()}</b></button>
      <button class="filter-pill ${state.scope === 'all' ? 'active crit' : 'crit'}" onclick="setScope('all')">All Forms <b>${completeForms.length.toLocaleString()}</b></button>
      <span class="scope-note">${kpiForms.length.toLocaleString()} form(s) &middot; ${storeRowCount(kpiForms).toLocaleString()} store rows in scope</span>
    </div>`;

  // One panel per entry; assembled below so the two region panels are true
  // siblings inside .panel-row (they were previously nested, which stacked them).
  const panelCapture = `
      <div class="panel">
        <div class="panel-head">
          <div><div class="panel-title">Capturing Compliance by Region</div>
          <div class="panel-sub">Targeted stores actually visited &middot; ${scopeNote}</div></div>
        </div>
        <div class="panel-body">${byRegion.length ? barList(byRegion, a => a.coverage, a => `${a.captured.toLocaleString()}/${a.target.toLocaleString()}`, 'region') : '<div class="empty-state">No store rows in scope.</div>'}</div>
      </div>`;

  const panelRegionComp = `
      <div class="panel">
        <div class="panel-head">
          <div><div class="panel-title">Compliance by Region</div>
          <div class="panel-sub">Scored over all targeted stores &middot; ${scopeNote}</div></div>
        </div>
        <div class="panel-body">${byRegionComp.length ? barList(byRegionComp, a => a.compliance, a => `${Math.round(a.yes).toLocaleString()} of ${a.slots.toLocaleString()}`, 'region') : '<div class="empty-state">No store rows in scope.</div>'}</div>
      </div>`;

  return `
    ${scopeToggle}
    <div class="kpi-grid">
      ${kpi(kpiIsOpen ? 'Forms in Progress' : 'Forms', kpiForms.length, kpiIsOpen ? 'In Progress' : (state.scope === 'all' ? 'all completed forms' : 'no open forms &mdash; showing all completed'), 'var(--color-accent)')}
      ${kpi('% Stores Visited', fmtPct(pct(visited)), `${kCaptured.toLocaleString()} of ${kTarget.toLocaleString()} visited`, tierColor(pct(visited)))}
      ${kpi('Display Compliance', fmtPct(pct(kCompliance)), `${kAnswered.toLocaleString()} of ${kAuditRows.length.toLocaleString()} targeted stores answered`, tierColor(pct(kCompliance)))}
      ${kpi('Time Gone', fmtPct(pct(avgTimeGone)), '', 'var(--color-neutral-400)')}
      ${kpi('Stores Not Visited', kNotCap.toLocaleString(), 'no submission received yet', 'var(--nx-crit)')}
      ${kpi('Behind Time Gone', behind.filter(x => x.gap > 0).length, 'forms behind time gone', 'var(--nx-warn)')}
    </div>

    <div class="panel"><div class="panel-body" style="padding:12px 15px;">
      <div class="panel-title" style="margin-bottom:4px;">Where to Focus</div>
      <div class="panel-sub" style="margin-bottom:10px;">${
        focusBasis === 'behind' ? 'Open forms behind their time gone'
        : focusBasis === 'openCompliance' ? 'Nothing is behind time gone &mdash; showing the weakest open forms on display compliance'
        : 'No open forms &mdash; showing the weakest closed forms on display compliance'}</div>
      ${focusList.length ? `<div class="focus-list">${(state.focusExpanded ? focusList : focusList.slice(0, 4)).map(x => `
        <div class="focus-item ${focusBasis === 'behind' ? '' : 'warn'}"><span class="dot"></span>
          ${focusBasis === 'behind'
            ? `<span>${esc(x.c.name)} &mdash; <b>${fmtPct(pct(x.c.coverage),0)}</b> captured with <b>${fmtPct(x.t.timeGone*100,0)}</b> of the window gone &middot; ${fmtDaysLeft(x.t.daysLeft)}</span>
               <span class="pct">+${Math.round(x.gap*100)}pts</span>`
            : `<span>${esc(x.c.name)} &mdash; <b>${fmtPct(pct(formCompliance(x.c)),0)}</b> display compliance on <b>${fmtPct(pct(x.c.coverage),0)}</b> captured${x.t.known && x.t.open ? ' &middot; ' + fmtDaysLeft(x.t.daysLeft) : ''}</span>
               <span class="pct">${fmtPct(pct(formCompliance(x.c)),0)}</span>`}
        </div>
      `).join('')}</div>
      ${focusList.length > 4 ? `<div class="table-note" style="padding:8px 0 0;">
        Showing ${state.focusExpanded ? focusList.length : 4} of ${focusList.length}.
        <button class="reset-btn" style="padding:2px 9px;font-size:10px;margin-left:4px;" onclick="setFocusExpanded(${state.focusExpanded ? 'false' : 'true'})">${state.focusExpanded ? 'Show less' : 'Expand to see more'}</button>
      </div>` : ''}` : '<div class="empty-state">No forms match the current filters.</div>'}
    </div></div>

    <div class="panel-row">${panelCapture}${panelRegionComp}</div>

    ${behind.length ? `
    <div class="panel">
      <div class="panel-head"><div>
        <div class="panel-title">Forms in Progress vs Time Gone</div>
      </div></div>
      <div class="panel-body">
        ${behind.map((x,i) => {
          const cov = pct(x.c.coverage), clock = x.t.timeGone*100;
          const col = x.gap > 0.10 ? 'var(--nx-crit)' : (x.gap > 0 ? 'var(--nx-warn)' : 'var(--nx-good)');
          return `
          <div class="ranked-row"><span class="rank">${i+1}</span>
            <button class="name name-btn ${state.formQ === x.c.name ? 'active' : ''}" style="width:440px;" title="${state.formQ === x.c.name ? 'Clear this filter' : 'Filter by ' + esc(x.c.name)}" onclick="setFormQ(state.formQ === ${jsArg(x.c.name)} ? '' : ${jsArg(x.c.name)})">${esc(x.c.name)}</button>
            <div class="track" style="position:relative;">
              <div class="fill" style="width:${cov}%;background:${col};"></div>
              <div title="${fmtPct(clock,0)} of window elapsed" style="position:absolute;top:-2px;bottom:-2px;left:${clock}%;width:2px;background:var(--color-neutral-100);opacity:.85;"></div>
            </div>
            <span class="value" style="color:${col};">${fmtPct(cov,0)}</span>
            <span class="value" style="width:78px;color:var(--color-neutral-500);font-weight:400;">${fmtDaysLeft(x.t.daysLeft)}</span>
          </div>`;
        }).join('')}
      </div>
      <div class="table-note">White marker = share of the survey window elapsed. Bar left of the marker means capture is trailing the clock.</div>
    </div>` : ''}

    <div class="panel">
      <div class="panel-head"><div>
        <div class="panel-title">Compliance by Banner</div>
      </div></div>
      <div class="panel-body">
        ${byBanner.length ? barList(byBanner, a => a.compliance, a => `${Math.round(a.yes).toLocaleString()} of ${a.slots.toLocaleString()}`, 'banner') : '<div class="empty-state">No store rows in scope.</div>'}
      </div>
    </div>
  `;
}

function renderCampaignsTable(campaigns) {
  const statusOf = c => (c.status === 'complete' ? (isOpen(c) ? 'open' : 'closed') : 'pending');
  const filtered = campaigns
    .filter(c => state.formStatus === 'ALL' || statusOf(c) === state.formStatus)
    .filter(c => !state.search || c.name.toLowerCase().includes(state.search.toLowerCase()))
    // Worst first, mirroring the Power BI Priority Summary. Open campaigns lead,
    // ranked by pacing gap, because those are the ones still worth chasing.
    .sort((a, b) => {
      const ao = isOpen(a), bo = isOpen(b);
      if (ao !== bo) return ao ? -1 : 1;
      if (ao) return (pacingGap(b) ?? -Infinity) - (pacingGap(a) ?? -Infinity);
      const av = formCompliance(a) ?? Infinity, bv = formCompliance(b) ?? Infinity;
      return av - bv;
    });
  const rows = filtered.map(c => {
    let typeTag, metric;
    if (c.status === 'pending') {
      typeTag = '<span class="type-tag audit">Pending</span>';
      metric = '<span class="pill na" title="Blueprint exists but no compliance report has been built">Not built</span>';
    } else if (c.status === 'locked') {
      typeTag = '<span class="type-tag audit">Locked</span>';
      metric = '<span class="pill na" title="Report file was open when the data was extracted; retry next refresh">Locked</span>';
    } else {
      typeTag = c.kind === 'sos' ? '<span class="type-tag sos">SOS / Facings</span>' : c.kind === 'price' ? '<span class="type-tag price">Price Survey</span>' : '<span class="type-tag audit">Compliance Audit</span>';
      const tc = formCompliance(c);
      const ans = answeredCount(c.storeRows);
      const tot = (c.storeRows || []).length;
      metric = c.kind === 'price'
        ? '<span class="pill na" title="Price surveys have no Yes/No or target metric to score">N/A</span>'
        : `<span class="mini-track" title="Scored over all ${tot.toLocaleString()} targeted stores; ${ans.toLocaleString()} answered. Report basis (answered only): ${fmtPct(pct(c.compliance))}"><span class="mini-fill" style="width:${pct(tc)}%;background:${tierColor(pct(tc))};"></span></span><span class="pill ${tierClass(pct(tc))}" title="Report basis (answered stores only): ${fmtPct(pct(c.compliance))}">${fmtPct(pct(tc))}${c.mixed?'*':''}</span>`;
    }
    const t = timing(c);
    const window = t.known
      ? `<span style="white-space:nowrap;">${c.periodStart.slice(5)} &rarr; ${c.periodEnd.slice(5)}</span>`
      : '<span style="color:var(--color-neutral-500);">—</span>';
    const gap = pacingGap(c);
    // Time gone folded into the status cell: the two always read together, and
    // separately they cost a whole column each.
    const statusCell = !t.known
      ? '<span class="pill na">—</span>'
      : t.open
        ? `<span class="pill ${gap > 0.10 ? 'crit' : gap > 0 ? 'warn' : 'good'}" title="${fmtDaysLeft(t.daysLeft)}${gap !== null && gap > 0 ? ', ' + Math.round(gap*100) + ' points behind schedule' : ''}">${fmtDaysShort(t.daysLeft)}${gap !== null && gap > 0 ? ` &middot; +${Math.round(gap*100)}` : ''}</span>`
        : '<span class="pill na">Closed</span>';
    const timeGone = t.known
      ? `<span class="pill na" title="${fmtPct(t.timeGone*100,1)} of the survey window elapsed">${fmtPct(t.timeGone*100,0)}</span>`
      : '<span style="color:var(--color-neutral-500);">—</span>';
    // Captured and target in one cell -- they are only ever read as a ratio.
    const storesCell = (c.captured === null || c.captured === undefined)
      ? '—'
      : `${Number(c.captured).toLocaleString()}<span style="color:#4a6b8a;"> / ${Number(c.target || 0).toLocaleString()}</span>`;
    return `<tr>
      <td class="name-cell" title="${esc(c.name)}">${esc(c.name)}</td>
      <td>${window}</td>
      <td>${timeGone}</td>
      <td>${statusCell}</td>
      <td class="num">${storesCell}</td>
      <td class="num">${fmtPct(pct(c.coverage))}</td>
      <td>${metric}</td>
    </tr>`;
  }).join('');
  return `
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">All Forms</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${(() => {
            // Counts ignore the status pill itself so each pill shows the size of
            // what it would select, not of the current selection.
            const pool = campaigns.filter(c => !state.search || c.name.toLowerCase().includes(state.search.toLowerCase()));
            const n = k => pool.filter(c => statusOf(c) === k).length;
            const pill = (val, label, count, tone) => `<button class="filter-pill ${state.formStatus === val ? 'active ' + tone : tone}" onclick="setFormStatus('${val}')">${label} <b>${count.toLocaleString()}</b></button>`;
            return pill('open', 'In Progress', n('open'), 'good') + pill('closed', 'Completed', n('closed'), 'crit');
          })()}
          <input class="search-input" placeholder="Search form…" value="${esc(state.search)}" oninput="setSearch(this.value)">
        </div>
      </div>
      <div class="table-wrap" id="forms-table"><table>
        <thead><tr>
          <th>Form</th>
          <th title="Survey window">Window</th>
          <th title="Share of the survey window elapsed">Time</th>
          <th title="Days remaining, and points behind the clock">Status</th>
          <th class="num" title="Stores captured of stores targeted">Captured</th>
          <th class="num" title="Capturing compliance">Captured %</th>
          <th title="Display compliance, scored over all targeted stores">Compliance</th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="empty-state">No forms match.</td></tr>'}</tbody>
      </table></div>
    </div>
  `;
}

function renderPricing(campaigns) {

    .filter(c => !state.search || c.name.toLowerCase().includes(state.search.toLowerCase()))

      ? `<span style="white-space:nowrap;">${c.periodStart.slice(5)} &rarr; ${c.periodEnd.slice(5)}</span>`

    const statusCell = c.status === 'pending'
      ? '<span class="pill na">Report not built yet</span>'

  return `

        <span class="kpi-label">% Stores Visited</span><span class="kpi-value" style="color:${tierColor(pct(kVisited))};">${fmtPct(pct(kVisited))}</span>
        <span class="kpi-sub">${kCaptured.toLocaleString()} of ${kTarget.toLocaleString()} visited</span>
      </div></div>
      <div class="kpi-card"><div class="kpi-accent" style="background:var(--color-neutral-400);"></div><div class="kpi-body">
        <span class="kpi-label">Stores Not Visited</span><span class="kpi-value">${(kTarget-kCaptured).toLocaleString()}</span>
        <span class="kpi-sub">no submission received yet</span>

        <tbody>${rows || '<tr><td colspan="7" class="empty-state">No price survey forms match.</td></tr>'}</tbody>
      </table></div>
      <div class="table-note">Click a form to load its store level detail below. These are the pure price-survey forms (Dashboard label "Compliance N/A") &mdash; no Yes/No or Target metric exists to score, so they're tracked here on coverage alone.</div>
